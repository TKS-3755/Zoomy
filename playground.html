 u to square root of u\n        set u to u + 1\n        set y to y / u\n    set y2 to y * y\n    set t to y\n    set s to y\n    set i to 1\n    repeat forever:\n        set u to absolute value of t\n        if u is below lim:\n            stop\n        set t to t * y2\n        set t to 0 - t\n        set i to i + 2\n        set u to t / i\n        set s to s + u\n    set s to s * 64\n    if inv is 1:\n        set u to pi / 2\n        set s to u - s\n    if neg is 1:\n        set s to 0 - s\n    give back s\n", "playground_glue.py": "\"\"\"The Python side of the browser playground (runs inside Pyodide, but works anywhere).\nzoomy_playground(text, mode, stdin) -> JSON text {\"ok\", \"out\", \"error\", \"line\", \"fix\"}\nmodes: check (compile only), run, python (show generated code), explain, fmt\"\"\"\nimport io\nimport json\nimport re\nimport sys\n\nimport zoomy_py\nimport zoomy_suggest\nimport zoomy_fmt\n\nNAME = \"program.zmy\"\n\n\ndef _error(e, text):\n    line = e.line if getattr(e, \"line\", None) else None\n    msg = re.sub(r\"^[^:]*:\\d+:\\s*\", \"\", str(e))\n    msg = re.sub(r\"^program\\.zmy:\\s*\", \"\", msg)\n    fix = zoomy_suggest.suggest(text, NAME, e) if line else None\n    return {\"ok\": False, \"out\": \"\", \"error\": msg, \"line\": line, \"fix\": fix}\n\n\ndef zoomy_playground(text, mode=\"check\", stdin=\"\"):\n    if not text.endswith(\"\\n\"):\n        text += \"\\n\"\n    try:\n        if mode == \"explain\":\n            return json.dumps({\"ok\": True, \"out\": zoomy_py.explain(text, NAME)})\n        if mode == \"fmt\":\n            new = zoomy_fmt.format_text(text, NAME)\n            if zoomy_fmt._compile(new, NAME) != zoomy_fmt._compile(text, NAME):\n                new = text\n            return json.dumps({\"ok\": True, \"out\": new})\n        prog = zoomy_py.Program(NAME)\n        prog.load_text(text, NAME)\n        warnings = []\n        src, _ = zoomy_py.compile_python(prog, warnings.append)\n        if prog.uses_extern:\n            return json.dumps({\"ok\": False, \"out\": \"\", \"error\": \"'extern' (C libraries) needs the native compiler; it cannot run in the browser\", \"line\": None, \"fix\": None})\n        if mode == \"check\":\n            return json.dumps({\"ok\": True, \"out\": \"\".join(\"Warning: \" + w + \"\\n\" for w in warnings)})\n        if mode == \"python\":\n            return json.dumps({\"ok\": True, \"out\": src})\n        # run\n        raw = io.BytesIO()\n        out = io.TextIOWrapper(raw, encoding=\"utf-8\", write_through=True)\n        old = sys.stdout, sys.stdin, sys.argv\n        sys.stdout = out\n        sys.stdin = io.TextIOWrapper(io.BytesIO(stdin.encode(\"utf-8\")), encoding=\"utf-8\")\n        sys.argv = [NAME]\n        err = None\n        try:\n            exec(compile(src, NAME + \".py\", \"exec\"), {\"__name__\": \"__main__\"})\n        except SystemExit:\n            pass\n        except Exception as e:                      # a run-time stop (division by zero, a failed check, ...)\n            err = f\"{type(e).__name__}: {e}\"\n        finally:\n            sys.stdout, sys.stdin, sys.argv = old\n        out.flush()\n        r = {\"ok\": err is None, \"out\": raw.getvalue().decode(\"utf-8\", \"replace\")}\n        if err:\n            r[\"error\"], r[\"line\"], r[\"fix\"] = err, None, None\n        return json.dumps(r)\n    except zoomy_py.ZoomyError as e:\n        return json.dumps(_error(e, text))\n    except Exception as e:\n        return json.dumps({\"ok\": False, \"out\": \"\", \"error\": f\"{type(e).__name__}: {e}\", \"line\": None, \"fix\": None})\n"}</script>
<script id="examples-data" type="application/json">{"hello": "action start:\n    print \"Hello from Zoomy!\"\n    Let a number be called n\n    set n to 5.0\n    Let a number be called total\n    set total to 0.0\n    while n is greater than 0.0:\n        add n to total\n        subtract 1.0 from n\n    print \"1+2+3+4+5 = \", total\n    finish with total\n", "fizzbuzz": "(FizzBuzz, the readable way.)\nfor number from 1 to 15:\n    if number mod 15 is 0:\n        print \"FizzBuzz\"\n    else if number mod 3 is 0:\n        print \"Fizz\"\n    else if number mod 5 is 0:\n        print \"Buzz\"\n    else:\n        print number\n", "factorial": "(Routines are real calls, so recursion works. Variables are global,)\n(so recurse \"tail style\": do the multiplying before the recursive call.)\n(Variables shared by the whole program)\nLet a number be called acc\nLet a number be called n\n\nroutine fact:\n    if n is greater than 1.0:\n        multiply acc by n\n        subtract 1.0 from n\n        run fact\n\naction start:\n    set n to 10.0\n    set acc to 1.0\n    run fact\n    print \"10! = \", acc\n", "primes": "(Primes and perfect squares, all numbers: this whole program compiles to a native ELF (Zoomy 5.1).)\nmake checked a global number\nCreate an array named primes with 30 slots\nLet a number be called found\n\n(Give back 1 when n is prime, otherwise 0.)\ndefine is_prime with n:\n    if n is less than 2:\n        give back 0\n    for d from 2 to square root of n:\n        add 1 to checked\n        if n mod d is 0:\n            give back 0\n    give back 1\n\n(Find the first 30 primes.)\nLet a number be called candidate\nset candidate to 2\nuntil found is 30:\n    if is_prime(candidate) is 1:\n        set item found of primes to candidate\n        add 1 to found\n    add 1 to candidate\n\nLet a number be called total\nfor each p in primes:\n    add p to total\nprint \"The first \", found, \" primes end with \", the last of primes, \".\"\nprint \"Their sum is \", total, \"; I tested \", checked, \" divisors.\"\n\n(Greatest common divisor, by recursion.)\ndefine gcd with m and k:\n    if k is 0:\n        give back m\n    give back gcd(k, m mod k)\nprint \"gcd(84, 36) = \", gcd(84, 36)\n\nLet a flag be called lucky\nset lucky to total is above 1000\nprint \"Is the sum above 1000? \", lucky\n", "temperatures": "(Conversational pipelines read left to right; ordinary formulas follow the usual order of operations.)\nLet a number be called celsius\nset celsius to 100 and multiply by 9 and divide by 5 and add 32\nprint \"100 C is \", celsius, \" F\"\n\nLet a number be called f\nset f to 98.6\nLet a number be called c\nset c to (f - 32) * 5 / 9\nprint \"98.6 F is \", rounded c to 1 places, \" C\"\n\nLet a number be called a_\nLet a number be called b\nset a_ to 10 and set b to 20 and add 5 to a_ and b and multiply a_ and b by 2\nprint a_, \" \", b\n", "wordcount": "(Count the words in a sentence with a table.)\nLet a string be called sentence\nset sentence to \"the quick brown fox jumps over the lazy dog the end\"\nLet a table be called counts\nset counts to empty table\nfor each word in split sentence by \" \":\n    if counts contains word:\n        add 1 to counts at word\n    else:\n        put 1 in counts at word\n\nLet a value be called words\nset words to keys of counts\nsort words\nfor each word in words:\n    print word, \": \", counts at word\nprint \"Most common word appears \", largest of values of counts, \" times.\"\n", "guess": "(Guess the number: the computer picks any number from a defined upper and lower bound, and you'll have to guess it, you have a predefined number of tries.)\n(Hints say higher or lower. Type \"quit\" to give up.)\nLet a number be called minimum_number\nset minimum_number to 1\nLet a number be called maximum_number\nset maximum_number to 100\nLet a number be called maximum_tries\nset maximum_tries to 10\n\nLet a value be called secret\nset secret to random between minimum_number and maximum_number\nLet a number be called tries\nset tries to 0\nLet a flag be called won\nset won to no\nLet a flag be called quit_early\nset quit_early to no\n\nprint \"I am thinking of a number from {minimum_number} to {maximum_number}.\"\nprint \"You have {maximum_tries} tries.\"\n\nwhile tries is less than maximum_tries and not won and not quit_early:\n    Let a string be called line\n    set line to ask \"Guess {tries + 1}: \"\n    if input_ok is 0 or trim of lowercase of line is \"quit\":\n        set quit_early to yes\n    else:\n        try:\n            Let a number be called guess\n            set guess to number from trim of line\n            check that guess is at least minimum_number\n            check that guess is at most maximum_number\n            add 1 to tries\n            if guess is secret:\n                set won to yes\n            else if guess is less than secret:\n                print \"Higher!\"\n            else:\n                print \"Lower!\"\n        if it fails:\n            print \"Please type a whole number from {minimum_number} to {maximum_number} (or quit).\"\n\nif won:\n    print \"Correct! You got it in {tries} tries.\"\nelse if quit_early:\n    print \"Giving up? The number was {secret}.\"\nelse:\n    print \"Out of tries. The number was {secret}.\"\n", "tictactoe": "(Tic-Tac-Toe: a 2-player game written in Zoomy.)\n(Players take turns picking an open square from 1 to 9.)\n\ndefine print_board with b:\n    print \"\"\n    print \" {b[0]} | {b[1]} | {b[2]} \"\n    print \"---+---+---\"\n    print \" {b[3]} | {b[4]} | {b[5]} \"\n    print \"---+---+---\"\n    print \" {b[6]} | {b[7]} | {b[8]} \"\n    print \"\"\n\ndefine check_winner with b and p:\n    (Check horizontal rows)\n    if b[0] is p and b[1] is p and b[2] is p:\n        give back yes\n    if b[3] is p and b[4] is p and b[5] is p:\n        give back yes\n    if b[6] is p and b[7] is p and b[8] is p:\n        give back yes\n\n    (Check vertical columns)\n    if b[0] is p and b[3] is p and b[6] is p:\n        give back yes\n    if b[1] is p and b[4] is p and b[7] is p:\n        give back yes\n    if b[2] is p and b[5] is p and b[8] is p:\n        give back yes\n\n    (Check diagonals)\n    if b[0] is p and b[4] is p and b[8] is p:\n        give back yes\n    if b[2] is p and b[4] is p and b[6] is p:\n        give back yes\n\n    give back no\n\n(--- Game Setup ---)\nCreate an array named board\nset board to [\"1\", \"2\", \"3\", \"4\", \"5\", \"6\", \"7\", \"8\", \"9\"]\nLet a string be called player\nset player to \"X\"\nLet a number be called turns\nset turns to 0\nLet a flag be called game_over\nset game_over to no\n\nprint \"Welcome to Zoomy Tic-Tac-Toe!\"\nprint \"Type a number (1-9) to claim a spot, or 'quit' to exit.\"\ncall print_board with board\n\n(--- Main Game Loop ---)\nwhile not game_over and turns is less than 9:\n    Let a flag be called move_made\n    set move_made to no\n\n    while not move_made:\n        Let a string be called choice\n        set choice to ask \"Player {player}'s turn: \"\n        if input_ok is 0 or trim of lowercase of choice is \"quit\":\n            print \"Thanks for playing!\"\n            finish with 0\n\n        try:\n            Let a number be called spot\n            set spot to number from trim of choice\n            check that spot is at least 1\n            check that spot is at most 9\n            Let a number be called idx\n            set idx to spot - 1\n            check that board[idx] is not \"X\" and board[idx] is not \"O\"\n\n            (Place the piece on the board)\n            set board[idx] to player\n            set move_made to yes\n        if it fails:\n            print \"Invalid spot! Please pick an open number between 1 and 9.\"\n\n    call print_board with board\n    add 1 to turns\n\n    (Check for victory or switch players)\n    if check_winner(board, player):\n        print \"Congratulations! Player {player} wins!\"\n        set game_over to yes\n    else:\n        if player is \"X\":\n            set player to \"O\"\n        else:\n            set player to \"X\"\n\n(--- Check for a Draw ---)\nif not game_over and turns is 9:\n    print \"Cat's game! It is a draw.\"\n", "hangman": "(A hangman game with categories, hints, scoring, and a save file.)\n(The computer picks a category and a word; you guess one letter at a time.)\n(This program showcases nearly every Zoomy 5 feature.)\n\nuse python's math as pymath\n\n(--- Constants and the word bank --------------------------------------)\n\nLet a number be called max_lives\nset max_lives to 6\n\nLet a number be called score\nset score to 0\n\n(A category is a pair: its name, then its list of words.)\nCreate an array named categories\nset categories to empty list\nappend a pair \"animals\", [\"tiger\", \"zebra\", \"otter\", \"eagle\", \"shark\", \"whale\", \"camel\", \"moose\"] to categories\nappend a pair \"fruits\", [\"apple\", \"mango\", \"lemon\", \"grape\", \"peach\", \"berry\", \"melon\"] to categories\nappend a pair \"colors\", [\"red\", \"blue\", \"green\", \"amber\", \"olive\", \"ivory\", \"coral\"] to categories\nappend a pair \"planets\", [\"mercury\", \"mars\", \"venus\", \"earth\", \"jupiter\", \"saturn\", \"uranus\", \"neptune\", \"dimidium\", \"dagon\", \"tadmor\", \"drukyul\", \"meztli\", \"lich\", \"hypatia\"] to categories\n\n(--- Helpers ----------------------------------------------------------)\n\n(The word being guessed and the letters guessed so far: made here, before the helpers that use them.)\nLet a string be called secret\nCreate an array named guessed\nLet a table be called stats\n\n(Stop with a message unless the condition holds.)\ndefine require with condition and message:\n    if not condition:\n        fail with message\n\n(Show the board: a row of letters or dashes.)\ndefine show_board:\n    Let a string be called row\n    set row to \"\"\n    for each letter in secret:\n        if guessed contains letter:\n            set row to row + letter + \" \"\n        else:\n            set row to row + \"_ \"\n    print row\n\n(Show the letters guessed so far, sorted.)\ndefine show_guessed:\n    if guessed are empty:\n        print \"(nothing guessed yet)\"\n    else:\n        Create an array named sorted_guessed\n        set sorted_guessed to sorted of guessed\n        print \"Guessed: \" + (join sorted_guessed with \" \")\n\n(Show the running stats. A routine shares the program's variables.)\nroutine show_stats:\n    print \"Games played: {stats's played}\"\n    print \"Games won: {stats's won}\"\n    print \"Current streak: {stats's streak}\"\n    print \"Best score: {stats's best}\"\n\n(--- Load saved stats --------------------------------------------------)\n\nset stats to table with \"played\" as 0 and \"won\" as 0 and \"streak\" as 0 and \"best\" as 0\n\nLet a string be called save_file\nset save_file to \"hangman_save.txt\"\n\nLet a string be called saved_text\nif file save_file exists:\n    try:\n        read file save_file into saved_text\n        Create an array named parts\n        set parts to split saved_text by \",\"\n        if length of parts is 4:\n            set stats at \"played\" to number from item 0 of parts\n            set stats at \"won\" to number from item 1 of parts\n            set stats at \"streak\" to number from item 2 of parts\n            set stats at \"best\" to number from item 3 of parts\n            print \"Welcome back. Best score so far: {stats's best}.\"\n    if it fails as problem:\n        print \"Could not read saved stats: {problem}\"\nelse:\n    print \"No saved stats. Starting fresh.\"\n\n(--- Validate the setup, then pick a word -------------------------------)\n\ntry:\n    call require with (length of categories is bigger than 0) and \"No categories loaded.\"\n    call require with (length of categories is bigger than 2) and \"Add more categories, please.\"\nif it fails as problem:\n    print \"Setup failed: {problem}\"\n    finish with 1\n\nLet a pair be called chosen\nset chosen to item (floor of (random number * length of categories)) of categories\n\nLet a string be called category\nset category to first of the chosen\n\nCreate an array named word_choices\nset word_choices to second of the chosen\n\nset secret to item (floor of (random number * length of word_choices)) of word_choices\nset secret to lowercase of secret\n\nLet a number be called word_length\nset word_length to length of secret\n\nset guessed to empty list\n\nLet a value be called hint\nset hint to nothing\nif word_length is over 5:\n    set hint to \"Try a vowel.\"\nelse if word_length is between 3 and 5:\n    set hint to \"It is a short word.\"\n\n(--- A tiny warm-up: a few expressions --------------------------------)\n\nLet a number be called n\nset n to 144\nLet a number be called root\ncalculate the square root of n and store the result in root\nLet a number be called rounded_pi\nset rounded_pi to rounded pi to 4 places\nprint \"sqrt({n}) = {root}, pi ~ {rounded_pi}\"\n\nLet a number be called digit\nconvert the character '7' to a number and store the result in digit\nLet a string be called ascii\nconvert the number 101 to ASCII and store the result in ascii\nprint \"Digit 7 = {digit}, ASCII 101 = '{ascii}'\"\nprint char 65\nprint \"\"\n\n(--- Difficulty -------------------------------------------------------)\n\nLet a number be called difficulty\nset difficulty to 2\nLet a string be called diff_str\nset diff_str to ask \"Difficulty (1 = easy, 2 = normal, 3 = hard) [2]: \"\nif trim of diff_str is not \"\":\n    try:\n        Let a number be called parsed_diff\n        set parsed_diff to number from trim of diff_str\n        if parsed_diff is at least 1 and parsed_diff is at most 3:\n            set difficulty to parsed_diff\n        else:\n            print \"Invalid choice; using 2.\"\n    if it fails:\n        print \"Invalid choice; using 2.\"\n\nLet a number be called lives\nset lives to max_lives - difficulty + 1\n\n(--- The game loop ----------------------------------------------------)\n\nLet a flag be called won\nset won to no\n\nLet a flag be called quit_early\nset quit_early to no\n\nLet a number be called started\nset started to current time\n\nprint \"\"\nprint \"Category: {category}\"\nprint \"The word has {word_length} letters. You have {lives} lives.\"\nif hint is not nothing:\n    print \"Hint: {hint}\"\nshow_board()\n\nuntil lives is 0 or won or quit_early:\n    print \"\"\n    show_guessed()\n\n    (Ask for a letter, retrying on bad input.)\n    Let a flag be called valid_turn\n    set valid_turn to no\n    Let a string be called letter\n    set letter to \"\"\n\n    while not valid_turn:\n        Let a string be called line\n        set line to ask \"Guess a letter (or 'quit'): \"\n        if input_ok is 0:\n            set quit_early to yes\n            set valid_turn to yes\n        else:\n            set line to trim of lowercase of line\n            if line is \"quit\":\n                set quit_early to yes\n                set valid_turn to yes\n            else if length of line is 1:\n                set letter to line\n                set valid_turn to yes\n            else:\n                print \"Please type a single letter.\"\n\n    if quit_early:\n        stop\n\n    if letter is in guessed:\n        print \"You already guessed '{letter}'.\"\n        skip\n\n    append letter to guessed\n\n    if secret contains letter:\n        print \"Good! '{letter}' is in the word.\"\n    else:\n        set lives to lives - 1\n        if lives is no more than 1:\n            print \"Sorry, '{letter}' is not there. Last chance!\"\n        else:\n            print \"Sorry, '{letter}' is not there. {lives} lives left.\"\n\n    (Win check: every letter revealed.)\n    set won to yes\n    for each letter in secret:\n        if guessed contains letter:\n            skip\n        set won to no\n        stop\n\n    show_board()\n\n(--- Scoring ---------------------------------------------------------)\n\nwait 0.3 seconds\n\nif quit_early:\n    print \"\"\n    print \"Giving up? The word was '{secret}'.\"\nelse if won:\n    Let a number be called points\n    Structurally,\n        set points to ((lives * 10) + (word_length * 2)) * difficulty\n        set score to score + points\n    print \"\"\n    print \"You won! The word was '{secret}'.\"\n    print \"Points this round: {points}\"\nelse:\n    print \"\"\n    print \"Out of lives. The word was '{secret}'.\"\n\nprint \"Total score: {score}\"\nprint \"The game took {rounded (current time - started) to 1 place} seconds.\"\n\n(--- Save the score --------------------------------------------------)\n\nif not quit_early:\n    Let a string be called answer\n    set answer to ask \"Save? (yes / no / delete): \"\n    set answer to lowercase of trim of answer\n\n    if answer is \"delete\":\n        try:\n            delete file save_file\n            print \"Save deleted.\"\n        if it fails as problem:\n            print \"Could not delete: {problem}\"\n    else if answer is \"yes\" or answer is \"y\":\n        set stats at \"played\" to stats at \"played\" + 1\n        if won:\n            set stats at \"won\" to stats at \"won\" + 1\n            set stats at \"streak\" to stats at \"streak\" + 1\n            if stats at \"streak\" is bigger than stats at \"best\":\n                set stats at \"best\" to stats at \"streak\"\n        else:\n            set stats at \"streak\" to 0\n        if score is bigger than stats at \"best\":\n            set stats at \"best\" to score\n        try:\n            Create an array named save_parts\n            set save_parts to empty list\n            append text of stats at \"played\" to save_parts\n            append text of stats at \"won\" to save_parts\n            append text of stats at \"streak\" to save_parts\n            append text of stats at \"best\" to save_parts\n            Let a string be called save_line\n            set save_line to join save_parts with \",\"\n            write save_line to file save_file\n            print \"Saved.\"\n        if it fails as problem:\n            print \"Could not save: {problem}\"\n\n(--- A small tour of the language, for fun ---------------------------)\n\nprint \"\"\nprint \"A quick tour of some expressions:\"\n\n(A list, sorted, inserted into, removed from, and reversed.)\nCreate an array named demo\nset demo to [3, 1, 2]\nsort demo\ninsert 0 into demo at 0\nremove item at 3 from demo\nreverse demo\nprint \"  demo = {demo}\"\n\n(B: A Structurally block uses textbook precedence: (10 + 5) * 2.)\nLet a number be called power_demo\nStructurally,\n    set power_demo to 10 + 5 * 2\nprint \"  10 + 5 * 2 structurally = {power_demo}\"\n\n(C: The default mode is left to right, like a recipe: (10 + 5) * 2.)\nLet a number be called linear_demo\nset linear_demo to 10 + 5 * 2\nprint \"  10 + 5 * 2 conversationally = {linear_demo}\"\n\n(D: An old-style Simply block, for comparison.)\nSimply,\n    set old_total to 0\n    for old_i from 1 to 3:\n        add old_i to old_total\n    print \"  old-style total = \" + text of old_total\n\n(E: A quad (a fixed group of four) and its parts.)\nLet a quad be called player\nset player to a quad score, lives, word_length, difficulty\nprint \"  score = {first of player}, lives = {second of player}\"\n\n(F: Remainder, powers, and a Python library.)\nLet a number be called r\nset r to remainder of word_length divided by 2\nLet a number be called sq\nset sq to word_length to the power of 2\nLet a number be called lg\nset lg to pymath's log(score + 1)\nprint \"  word_length mod 2 = {r}, word_length^2 = {sq}, log(score+1) = {rounded lg to 2 places}\"\n\n(G: Keys and values of a table.)\nLet a table be called summary\nset summary to table with \"games\" as stats at \"played\" and \"last_score\" as score and \"category\" as category\nfor each key in keys of summary:\n    print \"  {key} = {summary at key}\"\n\n(H: Count and position in a list.)\nLet a number be called how_many\nset how_many to count of \"g\" in secret\nLet a number be called where\nset where to position of \"g\" in secret\nif how_many is bigger than 0:\n    print \"  'g' appears {how_many} time(s), first at position {where}.\"\n\n(I: Command-line arguments.)\nif length of arguments is bigger than 0:\n    print \"  arguments = {arguments}\"\nelse:\n    print \"  (no command-line arguments)\"\n\n(--- Finale ---------------------------------------------------------)\n\nprint \"\"\nrun show_stats\n\nfinish with 0"}</script>
<script id="worker-src" type="text/plain">
let py, ready;
self.onmessage = async (ev) => {
  const m = ev.data;
  if (m.kind === "init") {
    ready = (async () => {
      importScripts(m.pyodide + "/pyodide.js");
      py = await loadPyodide({indexURL: m.pyodide + "/"});
      py.FS.mkdirTree("/zoomy");
      for (const [name, body] of Object.entries(m.sources)) py.FS.writeFile("/zoomy/" + name, body);
      py.runPython("import sys; sys.path.insert(0, '/zoomy')\nimport playground_glue");
    })();
    try { await ready; self.postMessage({kind: "ready"}); } catch (e) { self.postMessage({kind: "fatal", error: String(e)}); }
    return;
  }
  await ready;
  py.globals.set("_t", m.text); py.globals.set("_m", m.mode); py.globals.set("_i", m.stdin || "");
  const r = py.runPython("playground_glue.zoomy_playground(_t, _m, _i)");
  self.postMessage({kind: "result", id: m.id, mode: m.mode, result: JSON.parse(r)});
};
</script>
<script>
const $ = id => document.getElementById(id);
const sources = JSON.parse($("zoomy-sources").textContent);
const examples = JSON.parse($("examples-data").textContent);
const workerUrl = () => URL.createObjectURL(new Blob([$("worker-src").textContent], {type: "text/javascript"}));
let tab = "out", lastRun = "", seq = 0, checkTimer = 0;
function start() {
  const w = new Worker(workerUrl()); const ready = new Promise((res, rej) => {
    w.addEventListener("message", e => { if (e.data.kind === "ready") res(); if (e.data.kind === "fatal") rej(e.data.error); });});
  w.postMessage({kind: "init", sources, pyodide: new URL("https://cdn.jsdelivr.net/pyodide/v0.26.4/full", location.href).href}); return {w, ready};
}
let tools = start(), runner = start();
function ask(who, mode, text, stdin) {
  return who.ready.then(() => new Promise(res => {
    const id = ++seq;
    const h = e => { if (e.data.kind === "result" && e.data.id === id) { who.w.removeEventListener("message", h); res(e.data.result); } };
    who.w.addEventListener("message", h); who.w.postMessage({kind: "go", id, mode, text, stdin});
  }));
}
function setStatus(msg, cls) { const s = $("status"); s.className = cls || ""; s.textContent = msg; }
function showFix(r) {
  const line = r.line ? "line " + r.line + ": " : "";
  setStatus(line + r.error, "bad");
  if (r.fix && r.line) {
    const b = document.createElement("button"); b.id = "fix"; b.textContent = "Change to: " + r.fix;
    b.onclick = () => { const L = $("src").value.split("\n"); const ind = L[r.line - 1].match(/^\s*/)[0]; L[r.line - 1] = ind + r.fix; $("src").value = L.join("\n"); check(); };
    $("status").appendChild(document.createElement("br")); $("status").appendChild(b);
  }
}
async function check() {
  const r = await ask(tools, "check", $("src").value);
  if (r.ok) { setStatus("Reads fine." + (r.out ? " " + r.out.trim() : ""), "good"); } else showFix(r);
  if (tab !== "out") refreshTab();
}
async function refreshTab() {
  if (tab === "out") { $("view").textContent = lastRun; return; }
  const r = await ask(tools, tab, $("src").value);
  $("view").textContent = r.ok ? r.out : (r.line ? "line " + r.line + ": " : "") + r.error;
}
async function run() {
  $("run").disabled = true; $("stop").disabled = false; setStatus("Running...");
  const r = await ask(runner, "run", $("src").value, $("stdin").value);
  $("stop").disabled = true; $("run").disabled = false;
  lastRun = r.out + (r.ok ? "" : (r.out && !r.out.endsWith("\n") ? "\n" : "") + (r.line ? "line " + r.line + ": " : "") + r.error);
  if (r.ok) setStatus("Finished.", "good"); else if (r.line) showFix(r); else setStatus("The program stopped: " + r.error, "bad");
  tab = "out"; syncTabs(); $("view").textContent = lastRun || "(the program printed nothing)";
}
$("run").onclick = run;
$("stop").onclick = () => { runner.w.terminate(); runner = start(); $("stop").disabled = true; setStatus("Stopped.");
  lastRun += (lastRun ? "\n" : "") + "(stopped)"; tab = "out"; syncTabs(); $("view").textContent = lastRun; runner.ready.then(() => $("run").disabled = false); };
$("fmt").onclick = async () => { const r = await ask(tools, "fmt", $("src").value); if (r.ok) { $("src").value = r.out; check(); } else showFix(r); };
function syncTabs() { document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab)); }
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; syncTabs(); refreshTab(); });
$("src").addEventListener("input", () => { clearTimeout(checkTimer); checkTimer = setTimeout(check, 400); });
$("src").addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); if (!$("run").disabled) run(); } });
for (const n of Object.keys(examples)) { const o = document.createElement("option"); o.value = n; o.textContent = n; $("ex").appendChild(o); }
$("ex").onchange = () => { if ($("ex").value) { $("src").value = examples[$("ex").value]; $("ex").value = ""; check(); } };
$("src").value = examples["hello"] || "";
Promise.all([tools.ready, runner.ready]).then(() => { $("run").disabled = false; check(); }, e => setStatus("Zoomy could not start: " + e, "bad"));
</script></body></html>
