--------------------------------------------------------------- scanning helpers\n_CHR = re.compile(r\"'(?:[^'\\\\]|\\\\[nt0\\\\'])'\")\n\n\ndef mask_of(text):\n    \"\"\"True for every character that is inside text \"...\", a 'c' character, or ( ) / [ ] brackets.\"\"\"\n    n = len(text)\n    m = [False] * n\n    depth = 0\n    i = 0\n    while i < n:\n        c = text[i]\n        if c == '\"':\n            j = i + 1\n            while j < n and text[j] != '\"':\n                if text[j] == \"\\\\\":\n                    j += 1\n                j += 1\n            for k in range(i, min(j + 1, n)):\n                m[k] = True\n            i = j + 1\n            continue\n        if c == \"'\" and not (i > 0 and (text[i - 1].isalnum() or text[i - 1] == \"_\")):\n            mm = _CHR.match(text, i)\n            if mm:\n                for k in range(i, mm.end()):\n                    m[k] = True\n                i = mm.end()\n                continue\n        if c in \"([\":\n            depth += 1\n            m[i] = True\n        elif c in \")]\":\n            m[i] = True\n            depth = max(0, depth - 1)\n        elif depth > 0:\n            m[i] = True\n        i += 1\n    return m\n\n\ndef find_top(rx, text, mask=None, start=0):\n    \"\"\"first match of compiled regex rx that starts outside strings and brackets\"\"\"\n    mask = mask if mask is not None else mask_of(text)\n    for m in rx.finditer(text, start):\n        if not mask[m.start()]:\n            return m\n    return None\n\n\ndef sub_top(pattern, repl, text, flags=re.I):\n    \"\"\"regex substitution that leaves strings and brackets alone; keeps a leading capital letter\"\"\"\n    rx = re.compile(pattern, flags)\n    mask = mask_of(text)\n    out, last = [], 0\n    for m in rx.finditer(text):\n        if mask[m.start()]:\n            continue\n        r = repl(m) if callable(repl) else m.expand(repl)\n        if m.group(0)[:1].isupper() and r[:1].islower():\n            r = r[:1].upper() + r[1:]\n        out.append(text[last:m.start()])\n        out.append(r)\n        last = m.end()\n    out.append(text[last:])\n    return \"\".join(out)\n\n\ndef split_top(text, sep):\n    mask = mask_of(text)\n    parts, last = [], 0\n    for i, c in enumerate(text):\n        if c == sep and not mask[i]:\n            parts.append(text[last:i])\n            last = i + 1\n    parts.append(text[last:])\n    return parts\n\n\ndef first_word(text):\n    m = re.match(r\"\\s*([A-Za-z_][A-Za-z0-9_]*)\", text)\n    return m.group(1).lower() if m else \"\"\n\n\n# --------------------------------------------------------------------------------------------- word lists\nSTMT_VERBS = {\"set\", \"add\", \"subtract\", \"multiply\", \"divide\", \"print\", \"write\", \"append\", \"insert\", \"remove\", \"sort\", \"reverse\",\n              \"clear\", \"read\", \"delete\", \"store\", \"load\", \"put\", \"calculate\", \"convert\", \"call\", \"run\", \"wait\", \"finish\", \"fail\",\n              \"check\", \"give\", \"stop\", \"skip\", \"show\", \"display\", \"say\", \"return\", \"continue\", \"increase\", \"decrease\", \"double\",\n              \"halve\", \"triple\", \"take\", \"warn\", \"ask\", \"let\", \"create\", \"define\", \"include\", \"use\", \"make\", \"ensure\", \"verify\"}\n# words that may start a line and are written with a capital letter at the start of a sentence\nKEYWORDS = STMT_VERBS | {\"if\", \"else\", \"otherwise\", \"unless\", \"until\", \"while\", \"repeat\", \"for\", \"routine\", \"action\", \"try\", \"always\",\n                         \"when\", \"whenever\", \"provided\", \"only\", \"as\", \"global\", \"extern\", \"please\", \"first\", \"next\", \"then\",\n                         \"finally\", \"also\", \"now\", \"just\", \"is\", \"are\", \"does\", \"do\", \"what\", \"how\", \"where\"} - {\"let\", \"create\", \"define\"}\nFILLER = (\"please\", \"first\", \"next\", \"then\", \"finally\", \"also\", \"now\", \"just\", \"okay\", \"ok\",\n          # polite and formal\n          \"kindly\", \"hereby\", \"herewith\", \"henceforth\", \"thereupon\", \"thereafter\", \"subsequently\", \"furthermore\", \"moreover\",\n          \"additionally\", \"lastly\", \"secondly\", \"thirdly\", \"accordingly\", \"therefore\", \"consequently\", \"afterwards\", \"afterward\",\n          # chatty\n          \"alright\", \"anyway\", \"anyhow\", \"basically\", \"actually\", \"well\", \"so\", \"right\", \"yo\", \"hey\", \"um\", \"uh\", \"ahem\",\n          # old-fashioned\n          \"prithee\", \"pray\", \"verily\", \"forsooth\", \"indeed\", \"hark\")\n# longer ways to ask: \"go ahead and print x\", \"I would like you to print x\", \"let's print x\", \"we shall print x\"\nFILLER_PHRASES = (r\"go\\s+ahead\\s+and\", r\"do\\s+go\\s+ahead\\s+and\", r\"i\\s+would\\s+like\\s+you\\s+to\", r\"i'd\\s+like\\s+you\\s+to\", r\"i\\s+want\\s+you\\s+to\",\n                  r\"i\\s+need\\s+you\\s+to\", r\"i\\s+would\\s+like\\s+to\", r\"i'd\\s+like\\s+to\", r\"you\\s+(?:should|must|may|can|will|shall)(?:\\s+now)?\",\n                  r\"we\\s+(?:should|must|shall|will|need\\s+to|have\\s+to|can)(?:\\s+now)?\", r\"let'?s(?:\\s+now)?\", r\"let\\s+us(?:\\s+now)?\",\n                  r\"time\\s+to\", r\"next\\s+up\", r\"ok\\s+so\", r\"okay\\s+so\", r\"and\\s+now\", r\"now\\s+then\", r\"so\\s+then\", r\"i\\s+pray\\s+you\", r\"if\\s+you\\s+please\",\n                  r\"would\\s+you\\s+(?:please\\s+)?\", r\"could\\s+you\\s+(?:please\\s+)?\", r\"can\\s+you\\s+(?:please\\s+)?\", r\"do\\s+please\", r\"please\\s+do\",\n                  r\"lo\\s+and\", r\"well\\s+then\", r\"on\\s+with\\s+it\", r\"here\\s+goes\")\n\nNUM_WORDS = {\"zero\": 0, \"one\": 1, \"two\": 2, \"three\": 3, \"four\": 4, \"five\": 5, \"six\": 6, \"seven\": 7, \"eight\": 8, \"nine\": 9, \"ten\": 10,\n             \"eleven\": 11, \"twelve\": 12, \"thirteen\": 13, \"fourteen\": 14, \"fifteen\": 15, \"sixteen\": 16, \"seventeen\": 17,\n             \"eighteen\": 18, \"nineteen\": 19, \"twenty\": 20, \"thirty\": 30, \"forty\": 40, \"fifty\": 50, \"sixty\": 60, \"seventy\": 70,\n             \"eighty\": 80, \"ninety\": 90,\n             \"naught\": 0, \"nought\": 0, \"nil\": 0, \"zilch\": 0, \"nada\": 0}               # informal and old-fashioned zeros\nBIG_WORDS = {\"hundred\": 100, \"thousand\": 1000, \"million\": 1000000}\nMULT_WORDS = {\"dozen\": 12, \"score\": 20, \"gross\": 144}                                  # two dozen = 24, three score = 60\nNUMBER_WORDS = dict(NUM_WORDS, **BIG_WORDS, **MULT_WORDS)\n\n\ndef number_run(words):\n    \"\"\"['twenty', 'one'] -> 21, ['three', 'hundred'] -> 300, ['one', 'thousand', 'five'] -> 1005; None if it is not a number\"\"\"\n    total = current = 0\n    for w in words:\n        w = w.lower()\n        if w in NUM_WORDS:\n            current += NUM_WORDS[w]\n        elif w == \"hundred\":\n            current = (current or 1) * 100\n        elif w in MULT_WORDS:\n            current = (current or 1) * MULT_WORDS[w]\n        elif w in BIG_WORDS:\n            total += (current or 1) * BIG_WORDS[w]\n            current = 0\n        else:\n            return None\n    return total + current\n\n\nORDINAL_WORDS = {\"first\", \"second\", \"third\", \"fourth\", \"fifth\", \"sixth\", \"seventh\", \"eighth\", \"ninth\", \"tenth\", \"last\", \"no\", \"any\",\n                 \"every\", \"each\", \"the\", \"this\", \"that\", \"another\", \"which\", \"what\"}\n\nIF_WORDS = r\"when|whenever|provided\\s+that|only\\s+if|if\"\n# every way to start a condition, and the plain word it means\nHEAD_KW = {\"if\": \"if\", \"when\": \"if\", \"whenever\": \"if\", \"provided that\": \"if\", \"only if\": \"if\", \"unless\": \"unless\",\n           \"until\": \"until\", \"while\": \"while\", \"as long as\": \"while\",\n           # more formal / older / chattier\n           \"in case\": \"if\", \"in the event that\": \"if\", \"in the event\": \"if\", \"supposing that\": \"if\", \"supposing\": \"if\",\n           \"assuming that\": \"if\", \"assuming\": \"if\", \"given that\": \"if\", \"on condition that\": \"if\", \"so long as\": \"while\",\n           \"for as long as\": \"while\", \"whilst\": \"while\", \"until such time as\": \"until\", \"up until\": \"until\",\n           \"any time\": \"if\", \"anytime\": \"if\", \"every time\": \"if\", \"each time\": \"if\",\n           \"seeing that\": \"if\", \"considering that\": \"if\", \"granted that\": \"if\"}\n_COND_WORD = \"(\" + \"|\".join(sorted((w.replace(\" \", r\"\\s+\") for w in HEAD_KW), key=len, reverse=True)) + \")\"\nELSE_WORDS = r\"otherwise|else|or\\s+else|failing\\s+that|contrariwise|alternatively|in\\s+any\\s+other\\s+case|in\\s+all\\s+other\\s+cases|if\\s+not\\s+so|failing\\s+which|or\\s+otherwise\"\n_IF_START = re.compile(r\"(?i)^(?:(\" + ELSE_WORDS + r\")\\s*,?\\s+)?\" + _COND_WORD + r\"\\b\\s*\")\n_TRAILING = re.compile(r\"(?i)\\b\" + _COND_WORD + r\"\\b\")\n_THEN = re.compile(r\"(?i)\\bthen\\b\")\n_COMMA = re.compile(\",\")\n_ELSE = re.compile(r\"(?i)(?:,\\s*)?\\b(\" + ELSE_WORDS + r\")\\b\")\n\n\ndef _kw(word):\n    return HEAD_KW[re.sub(r\"\\s+\", \" \", word.lower())]\n\n\n# --------------------------------------------------------------------------------------------- small passes\ndef _strip_punct(text):\n    text = text.rstrip()\n    while text.endswith(\"!\") and not text.endswith(\"!=\"):\n        text = text[:-1].rstrip()\n    if text.endswith(\".\") and not text.endswith(\"..\") and len(text) > 1 and (not text[-2].isdigit() or \".\" in text.split()[-1][:-1]):\n        text = text[:-1].rstrip()\n    return text\n\n\n_CONTR = [(r\"\\bisn't\\b\", \"is not\"), (r\"\\baren't\\b\", \"are not\"), (r\"\\bdoesn't\\b\", \"does not\"), (r\"\\bdon't\\b\", \"do not\"),\n          (r\"\\bmustn't\\b\", \"must not\"), (r\"\\bshouldn't\\b\", \"should not\"), (r\"\\bcan't\\b\", \"cannot\"), (r\"\\bit's\\b\", \"it is\")]\n\n\n_COMPARE_VOICES = [\n    (r\"\\b(?:does\\s+not|doesn't)\\s+exceed\\b|\\bnever\\s+exceeds\\b|\\bis\\s+not\\s+(?:any\\s+)?(?:greater|bigger|larger|higher|more)\\s+than\\b|\\bis\\s+no\\s+(?:greater|bigger|larger|higher)\\s+than\\b\", \"is at most\"),\n    (r\"\\bis\\s+not\\s+(?:any\\s+)?(?:less|smaller|lower|fewer)\\s+than\\b|\\bis\\s+no\\s+(?:smaller|lower|less|fewer)\\s+than\\b\", \"is at least\"),\n    (r\"\\bis\\s+(?:strictly\\s+)?greater\\s+than\\s+or\\s+equal\\s+to\\b|\\bis\\s+not\\s+below\\b|\\bhas\\s+(?:reached|hit)\\b|\\breaches\\b|\\bis\\s+up\\s+to\\b\", \"is at least\"),\n    (r\"\\bis\\s+(?:strictly\\s+)?less\\s+than\\s+or\\s+equal\\s+to\\b|\\bis\\s+not\\s+above\\b\", \"is at most\"),\n    (r\"\\bexceeds\\b\", \"is above\"),\n    (r\"\\b(?:falls|is)\\s+short\\s+of\\b\", \"is below\"),\n    (r\"\\bdiffers\\s+from\\b|\\bis\\s+unequal\\s+to\\b|\\bis\\s+not\\s+equal\\s+to\\b|\\bis\\s+not\\s+the\\s+same\\s+as\\b|\\bis\\s+not\\s+identical\\s+to\\b\", \"is not\"),\n    (r\"\\bequals\\b|\\bis\\s+(?:exactly|precisely|just|identical\\s+to|equivalent\\s+to|exactly\\s+equal\\s+to)\\b\", \"is\"),\n]\n\n\ndef _comparisons(text):\n    \"\"\"other ways to compare: exceeds, falls short of, differs from, is no greater than, has reached ...\"\"\"\n    if not re.search(r\"(?i)exceed|short\\s+of|differs|equals|reach|\\bhas\\s+hit|no\\s+(?:greater|bigger|larger|higher|smaller|lower|less|fewer)|not\\s+(?:any\\s+)?(?:greater|bigger|larger|higher|more|less|smaller|lower|fewer|below|above|equal|the\\s+same|identical)|greater\\s+than\\s+or|less\\s+than\\s+or|exactly|precisely|\\bjust\\b|identical|equivalent|unequal|up\\s+to\", text):\n        return text\n    for pat, rep_ in _COMPARE_VOICES:\n        text = sub_top(pat, rep_, text)\n    return text\n\n\ndef _contractions(text):\n    if \"'\" not in text:\n        return text\n    for pat, rep in _CONTR:\n        text = sub_top(pat, rep, text)\n    return text\n\n\ndef _fillers(text):\n    rx = re.compile(r\"(?i)^(\" + \"|\".join(re.escape(f) if f.endswith(\",\") else f for f in FILLER) + \"|\" + \"|\".join(FILLER_PHRASES) + r\")(?:\\b|(?<=,))\\s*,?\\s*(.*)$\")\n    while True:\n        m = rx.match(text)\n        if not m or not m.group(2):\n            return text\n        rest = m.group(2)\n        if m.group(1).lower() == \"so\" and re.match(r\"(?i)long\\s+as\\b\", rest):          # \"so long as\" is a condition\n            return text\n        if m.group(1).lower() == \"next\" and re.fullmatch(r\"(?i)(one|please|one\\s+please)[.!]?\", rest.strip()):\n            return text                                                              # \"next one\" means skip\n        if rest[0] in \"('=\" or first_word(rest) in (\"is\", \"are\", \"of\", \"at\", \"to\", \"contains\", \"contain\", \"does\", \"do\"):\n            return text\n        text = rest\n\n\n_LEAD = re.compile(r\"(?i)^(?:and|also|then|after\\s+that)\\b[\\s,]*\")\n\n\ndef strip_lead(text):\n    \"\"\"'And', 'Also', 'Then' and 'After that,' at the start of a sentence only link it to the one before: they are ignored\"\"\"\n    while True:\n        text = text.strip()\n        m = _LEAD.match(text)\n        if not m or not text[m.end():].strip():\n            return text\n        text = text[m.end():]\n\n\ndef _finalize(text):\n    m = re.match(r\"([A-Za-z]+)\", text)\n    if m and m.group(1)[0].isupper() and m.group(1).lower() in KEYWORDS:\n        return m.group(1).lower() + text[m.end():]\n    return text\n\n\n# --------------------------------------------------------------------------------------------- questions (feature 7)\ndef _question(text):\n    if not text.endswith(\"?\"):\n        return None\n    q = text[:-1].strip()\n    if first_word(q) not in (\"is\", \"are\", \"does\", \"do\", \"what\", \"how\", \"where\"):\n        raise SentenceError(\"a question line starts with is, are, does, do, what, how many, how long or where \"\n                            \"(like: Is total above 5?)\")\n    return [(0, \"__question \" + q[:1].lower() + q[1:])]\n\n\n# --------------------------------------------------------------------------------------------- headers (feature 3)\n_LOOP_HEADS = [\n    # loop 5 times: / iterate 5 times: / do this 5 times: / go around 5 times:\n    (r\"(?:loop|iterate|cycle|go\\s+around|go\\s+round|do\\s+(?:this|that|the\\s+following|the\\s+next\\s+bit|it))\\s+(.+?)\\s+times\", r\"repeat \\1 times\"),\n    (r\"(?:loop|iterate|cycle)\\s+(?:forever|endlessly)|keep\\s+(?:going|on)\\s+forever|go\\s+on\\s+forever\", \"repeat forever\"),\n    # go through each score in scores: / loop over each ...\n    (r\"(?:go\\s+through|loop\\s+(?:over|through)|iterate\\s+(?:over|through)|walk\\s+through|run\\s+through|step\\s+through|work\\s+through)\\s+(?:each|every)\\s+(.+)\", r\"for each \\1\"),\n    (r\"for\\s+every\\s+(\\w+\\s+in\\s+.+)\", r\"for each \\1\"),\n]\n\n\ndef _header(h):\n    m = re.match(r\"(?i)^(?:\" + ELSE_WORDS + r\")$\", h.strip())\n    if m:\n        return \"otherwise\"\n    m = re.match(r\"(?i)^(?:\" + ELSE_WORDS + r\")\\s+\" + _COND_WORD + r\"\\b\\s*\", h)\n    if m:\n        return \"else \" + _kw(m.group(1)) + \" \" + h[m.end():]\n    m = re.match(r\"(?i)^keep\\s+(?:going|on|at\\s+it)\\s+(.+)$\", h)         # keep going while x is below 3\n    if m and re.match(_COND_WORD, m.group(1), re.I):\n        h = m.group(1)\n    m = re.match(r\"(?i)^\" + _COND_WORD + r\"\\b\\s*\", h)\n    if m:\n        return _kw(m.group(1)) + \" \" + h[m.end():]\n    for pat, rep_ in _LOOP_HEADS:\n        m = re.fullmatch(pat, h.strip(), re.I)\n        if m:\n            return m.expand(rep_)\n    return h\n\n\n# --------------------------------------------------------------------------------------------- statements\ndef _indent(lines, n=1):\n    return [(d + n, t) for d, t in lines]\n\n\ndef _split_joiners(text):\n    \"\"\"set x to 1 then print x  /  ..., and then ...  /  ..., so ...  /  ..., and print x\"\"\"\n    verbs = \"|\".join(sorted(STMT_VERBS, key=len, reverse=True))\n    rx = re.compile(r\"(?i)(?:,\\s*)?(?:\\band\\s+)?\\b(?:then|so(?!\\s+long\\s+as\\b)|after\\s+that)\\b|,\\s*and\\b(?=\\s+(?:\" + verbs + r\")\\b)\")\n    mask = mask_of(text)\n    pieces, last = [], 0\n    for m in rx.finditer(text):\n        if mask[m.start()] or m.start() == 0:\n            continue\n        pieces.append(text[last:m.start()])\n        last = m.end()\n    pieces.append(text[last:])\n    return [p.strip(\" ,\") for p in pieces if p.strip(\" ,\")]\n\n\ndef _body(text):\n    lines = []\n    for piece in _split_joiners(text):\n        lines += _simple(piece)\n    return lines\n\n\ndef _statement(text):\n    m = _IF_START.match(text)\n    if m:\n        return _inline_if(text)\n    m = re.match(r\"(?i)^(\" + ELSE_WORDS + r\")\\b\\s*,?\\s*(.+)$\", text)\n    if m:\n        return [(0, \"otherwise:\")] + _indent(_body(m.group(2)))\n    return _body(text)\n\n\ndef _inline_if(text):\n    m = _IF_START.match(text)\n    lead = \"else \" if m.group(1) else \"\"\n    kw = _kw(m.group(2))\n    rest = text[m.end():]\n    mask = mask_of(rest)\n    t = find_top(_THEN, rest, mask)\n    c = find_top(_COMMA, rest, mask)\n    if t and (not c or t.start() < c.start()):\n        cond, body = rest[:t.start()].rstrip(\" ,\"), rest[t.end():]\n    elif c:\n        cond, body = rest[:c.start()], re.sub(r\"(?i)^\\s*then\\b\\s*\", \"\", rest[c.end():])\n    else:\n        raise SentenceError(f\"this '{m.group(2).lower()}' line needs a ':' at the end, or 'then' with the action on the same line \"\n                            f\"(like: {m.group(2).lower()} x is 5 then print \\\"five\\\")\")\n    if not cond.strip() or not body.strip():\n        raise SentenceError(f\"this '{m.group(2).lower()}' line needs both a condition and an action\")\n    return _if_lines(lead, kw, cond.strip(), body)\n\n\ndef _if_lines(lead, kw, cond, body):\n    bmask = mask_of(body)\n    e = find_top(_ELSE, body, bmask)\n    then_part, else_part = (body[:e.start()], body[e.end():].strip(\" ,\")) if e else (body, \"\")\n    lines = [(0, f\"{lead}{kw} {cond}:\")] + _indent(_body(then_part))\n    if else_part:\n        if _IF_START.match(else_part) and not _IF_START.match(else_part).group(1):\n            lines += _inline_if(\"else \" + else_part)\n        else:\n            lines += [(0, \"otherwise:\")] + _indent(_body(else_part))\n    return lines\n\n\ndef _simple(text):\n    text = text.strip()\n    if not text:\n        return []\n    # a trailing condition: print \"Fizz\" if number mod 3 is 0   (either order of clauses)\n    if not _IF_START.match(text):\n        mask = mask_of(text)\n        for m in _TRAILING.finditer(text):\n            if mask[m.start()] or m.start() == 0:\n                continue\n            core, kw, cond = text[:m.start()].rstrip(\" ,\"), _kw(m.group(1)), text[m.end():].strip()\n            if not core or not cond:\n                break\n            if re.match(r\"(?i)(let|create|define)\\s+(?:a|an)\\s\", core):\n                break\n            return _trailing(core, kw, cond)\n    # counting adverbs: print \"hi\" twice / add 1 to x 3 times\n    # a count of several words: print \"hi\" twenty one times / add 1 to x three hundred times\n    m = re.match(r\"(?is)^(?P<head>.*\\S)\\s+times$\", text)\n    if m:\n        head = m.group(\"head\")\n        first, end = None, len(head)\n        for t in reversed(list(re.finditer(r\"[A-Za-z]+\", head))):\n            if t.end() != end or t.group().lower() not in NUMBER_WORDS:\n                break\n            first, end = t, t.start() - 1\n            while end >= 0 and head[end] in \" \\t-\":\n                end -= 1\n            end += 1\n        if first is not None and head[first.start():].count(\" \") + head[first.start():].count(\"-\") >= 1:\n            core = head[:first.start()].rstrip(\" \\t-\")\n            count = number_run(re.split(r\"[\\s-]+\", head[first.start():]))\n            if count is not None and core and (first_word(core) in KEYWORDS or _register(core) is not None) and not mask_of(text)[first.start()]:\n                return [(0, f\"repeat {count} times:\")] + _indent(_simple(core))\n    m = re.match(r\"(?is)^(?P<core>.+?)\\s+(?:(?P<w>once|twice)|(?P<n>[\\w.]+)\\s+times)$\", text)\n    if m and not mask_of(text)[m.start(\"w\") if m.group(\"w\") else m.start(\"n\")] and (first_word(m.group(\"core\")) in KEYWORDS or _register(m.group(\"core\")) is not None):\n        core = m.group(\"core\")\n        count = {\"once\": 1, \"twice\": 2}.get((m.group(\"w\") or \"\").lower()) if m.group(\"w\") else m.group(\"n\")\n        if count == 1:\n            return _simple(core)\n        return [(0, f\"repeat {count} times:\")] + _indent(_simple(core))\n    # modals: x must be at least 0 / x should be ... / x cannot be 0\n    mod = _modal(text)\n    if mod is not None:\n        return mod\n    return [(0, _finalize(_phrasal(_verbs(text))))]\n\n\ndef _trailing(core, kw, cond):\n    \"\"\"core <kw> cond [, otherwise ...]\"\"\"\n    mask = mask_of(cond)\n    e = find_top(_ELSE, cond, mask)\n    if e:\n        c, else_part = cond[:e.start()].strip(\" ,\"), cond[e.end():].strip(\" ,\")\n        lines = [(0, f\"{kw} {c}:\")] + _indent(_simple(core))\n        if _IF_START.match(else_part):\n            lines += _inline_if(\"else \" + else_part)\n        else:\n            lines += [(0, \"otherwise:\")] + _indent(_body(else_part))\n        return lines\n    return [(0, f\"{kw} {cond}:\")] + _indent(_simple(core))\n\n\n# --------------------------------------------------------------------------------------------- modals (feature 16)\n_MODAL = re.compile(r\"(?i)\\b(must|should|cannot)\\b\")\n\n\ndef _modal(text):\n    if first_word(text) in (\"print\", \"write\", \"show\", \"display\", \"say\", \"fail\", \"check\", \"warn\", \"set\", \"add\", \"put\", \"ask\"):\n        return None\n    mask = mask_of(text)\n    m = find_top(_MODAL, text, mask)\n    if not m or m.start() == 0:\n        return None\n    subject, modal, rest = text[:m.start()].strip(), m.group(1).lower(), text[m.end():].strip()\n    neg = modal == \"cannot\"\n    if re.match(r\"(?i)^not\\b\", rest):\n        neg, rest = Tru \", t)\n                if m:\n                    idx = m.group(3) if m.group(2).lower() == \"before\" else f\"({m.group(3)}) + 1\"\n                    t = f\"insert {m.group(1)} into {m.group(4)} at {idx}\"\n    elif fw in (\"add\", \"append\"):\n        t = sub_top(r\"\\bonto\\b\", \"to\", t)\n    elif fw == \"remove\":\n        t = sub_top(r\"\\bout\\s+of\\b\", \"from\", t)\n    return t\n\n\n# --------------------------------------------------------------------------------------------- registers (feature 22)\n# The same action can be asked for in many voices.  Each rule: (voice, pattern, plain wording, what it is)\n#   informal = chatty / slang,  formal = official / technical,  old = old-fashioned\n_NAME = r\"([A-Za-z_]\\w*(?:\\s+of\\s+[A-Za-z_]\\w*)?|item\\s+\\S+\\s+of\\s+\\S+)\"\n_GUARD = {\"is\", \"are\", \"of\", \"at\", \"contains\", \"contain\", \"does\", \"do\", \"and\", \"or\", \"=\", \"'s\"}\n\n\ndef _w(*words):\n    return \"(?:\" + \"|\".join(w.replace(\" \", r\"\\s+\") for w in sorted(words, key=len, reverse=True)) + \")\"\n\n\nREGISTER = [\n    # printing\n    (\"informal\", r\"^(?:shout|yell|holler|blurt(?:\\s+out)?|spit(?:\\s+out)?|toss\\s+out|call\\s+out|put\\s+out)\\s+(.+)$\", r\"print \\1\", \"print\"),\n    (\"informal\", r\"^(?:show\\s+me|let\\s+me\\s+see|lemme\\s+see|lemme\\s+look\\s+at|let\\s+me\\s+look\\s+at|print\\s+out)\\s+(.+)$\", r\"print \\1\", \"print\"),\n    (\"formal\", r\"^\" + _w(\"output\", \"emit\", \"report\", \"announce\", \"present\", \"state\", \"echo\", \"render\", \"indicate\", \"communicate\", \"list out\") + r\"\\s+(.+)$\", r\"print \\1\", \"print\"),\n    (\"old\", r\"^\" + _w(\"behold\", \"lo and behold\", \"proclaim\", \"utter\", \"recite\", \"declare\", \"pronounce\", \"hear ye\", \"make known\", \"let it be known that\", \"hark\") + r\"\\s*,?\\s+(.+)$\", r\"print \\1\", \"print\"),\n    # setting a value\n    (\"formal\", r\"^(?:assign|designate)\\s+\" + _NAME + r\"\\s+the\\s+value\\s+(?:of\\s+)?(.+)$\", r\"set \\1 to \\2\", \"set\"),\n    (\"formal\", r\"^(?:initiali[sz]e|reset)\\s+\" + _NAME + r\"\\s+to\\s+(.+)$\", r\"set \\1 to \\2\", \"set\"),\n    (\"formal\", r\"^(?:let|make)\\s+(?!.*\\b(?:called|named)\\b)\" + _NAME + r\"\\s+(?:be|equal|equals|become)\\s+(.+)$\", r\"set \\1 to \\2\", \"set\"),\n    (\"informal\", r\"^(?:stash|stick|chuck|shove|dump|park|toss|throw|slot|plop|pop)\\s+(.+?)\\s+(?:in|into|inside)\\s+\" + _NAME + r\"\\s*$\", r\"set \\2 to \\1\", \"set\"),\n    (\"informal\", r\"^(?:stash|stick|chuck|shove|dump|park|toss|throw|slot|plop|pop)\\s+(.+?)\\s+(?:in|into|inside)\\s+(.+?\\s+at\\s+.+)$\", r\"put \\1 in \\2\", \"put\"),\n    (\"old\", r\"^\" + _NAME + r\"\\s+(?:shall\\s+(?:be|become)|will\\s+(?:be|become)|should\\s+(?:now\\s+)?be|must\\s+(?:now\\s+)?be|becomes|doth\\s+become|is\\s+now|is\\s+hereby|is\\s+henceforth|now\\s+is|gets)\\s+(.+)$\", r\"set \\1 to \\2\", \"set\"),\n    # arithmetic\n    (\"informal\", r\"^(?:bump|up|pump\\s+up|crank\\s+up|ratchet\\s+up)\\s+(.+)$\", r\"increase \\1\", \"increase\"),\n    (\"formal\", r\"^(?:increment|augment|raise|elevate|escalate)\\s+(.+)$\", r\"increase \\1\", \"increase\"),\n    (\"informal\", r\"^tack\\s+(.+?)\\s+on(?:to)?\\s+(.+)$\", r\"add \\1 to \\2\", \"add\"),\n    (\"informal\", r\"^tack\\s+on\\s+(.+?)\\s+to\\s+(.+)$\", r\"add \\1 to \\2\", \"add\"),\n    (\"formal\", r\"^(?:decrement|diminish|reduce|lower|lessen|deplete|curtail)\\s+(.+)$\", r\"decrease \\1\", \"decrease\"),\n    (\"formal\", r\"^deduct\\s+(.+)$\", r\"subtract \\1\", \"subtract\"),\n    (\"informal\", r\"^(?:knock|shave|chip|trim|lop|scrape)\\s+(.+?)\\s+off(?:\\s+of)?\\s+(.+)$\", r\"subtract \\1 from \\2\", \"subtract\"),\n    (\"informal\", r\"^take\\s+(.+?)\\s+off(?:\\s+of)?\\s+(.+)$\", r\"subtract \\1 from \\2\", \"subtract\"),\n    (\"formal\", r\"^(?:scale|magnify|amplify)\\s+(.+?)\\s+by\\s+(.+)$\", r\"multiply \\1 by \\2\", \"multiply\"),\n    (\"informal\", r\"^square\\s+([A-Za-z_]\\w*)\\s*$\", r\"multiply \\1 by \\1\", \"mul \"present\", \"state\", \"echo\", \"render\", \"indicate\", \"communicate\", \"list\", \"behold\", \"lo\", \"proclaim\", \"utter\",\n               \"recite\", \"declare\", \"pronounce\", \"hear\", \"make\", \"hark\", \"assign\", \"designate\", \"initialise\", \"initialize\", \"reset\",\n               \"stash\", \"stick\", \"chuck\", \"shove\", \"dump\", \"park\", \"throw\", \"slot\", \"plop\", \"pop\", \"bump\", \"up\", \"pump\", \"crank\",\n               \"ratchet\", \"increment\", \"augment\", \"raise\", \"elevate\", \"escalate\", \"tack\", \"decrement\", \"diminish\", \"reduce\", \"lower\",\n               \"lessen\", \"deplete\", \"curtail\", \"deduct\", \"knock\", \"shave\", \"chip\", \"trim\", \"lop\", \"scrape\", \"scale\", \"magnify\",\n               \"amplify\", \"square\", \"bail\", \"break\", \"get\", \"bust\", \"cut\", \"quit\", \"stop\", \"cease\", \"terminate\", \"discontinue\", \"exit\",\n               \"leave\", \"abandon\", \"carry\", \"next\", \"keep\", \"go\", \"on\", \"proceed\", \"advance\", \"jump\", \"move\", \"hop\", \"wrap\", \"that\",\n               \"we\", \"pack\", \"bow\", \"conclude\", \"halt\", \"end\", \"hand\", \"send\", \"yield\", \"produce\", \"answer\", \"come\", \"respond\", \"reply\",\n               \"result\", \"return\", \"bestow\", \"pretty\"}\nVOICE_STARTS = {\"shout\", \"yell\", \"holler\", \"blurt\", \"spit\", \"output\", \"emit\", \"report\", \"announce\", \"present\", \"echo\", \"indicate\",\n                \"communicate\", \"behold\", \"proclaim\", \"utter\", \"recite\", \"declare\", \"pronounce\", \"hark\", \"assign\", \"designate\",\n                \"initialise\", \"initialize\", \"stash\", \"stick\", \"chuck\", \"shove\", \"dump\", \"park\", \"slot\", \"plop\", \"bump\", \"increment\",\n                \"augment\", \"elevate\", \"escalate\", \"tack\", \"decrement\", \"diminish\", \"reduce\", \"lessen\", \"deplete\", \"curtail\", \"deduct\",\n                \"knock\", \"chip\", \"lop\", \"scrape\", \"scale\", \"magnify\", \"amplify\", \"square\", \"bail\", \"bust\", \"cease\", \"discontinue\",\n                \"abandon\", \"conclude\", \"halt\", \"hop\", \"yield\", \"produce\", \"respond\", \"reply\"}\n\n\n# words that can start one of the statements above (also after ', and ...' and before a trailing 'twice' / 'if ...')\nVOICE_STARTS |= {\"lo\", \"hear\", \"shave\", \"trim\", \"reset\", \"raise\", \"lower\", \"state\", \"list\", \"render\", \"pump\", \"crank\", \"ratchet\", \"pop\",\n                 \"toss\", \"throw\", \"spit\", \"wrap\", \"pack\", \"bow\", \"quit\", \"exit\", \"leave\", \"terminate\", \"end\", \"carry\", \"proceed\", \"advance\",\n                 \"come\", \"send\", \"hand\", \"answer\", \"result\", \"bestow\", \"pronounce\", \"hark\", \"lessen\", \"deduct\", \"knock\", \"square\", \"scale\"}\nSTMT_VERBS.update(VOICE_STARTS)\nKEYWORDS.update(VOICE_STARTS)\n\n\ndef _register(text):\n    \"\"\"one action in another voice -> the plain sentence; None when the text is already plain\"\"\"\n    fw = first_word(text)\n    nxt = text.split(None, 1)[1].split(None, 1)[0].lower() if len(text.split(None, 1)) > 1 else \"\"\n    variable_like = (nxt in _GUARD and fw not in (\"we\", \"that\", \"call\", \"wrap\", \"pack\", \"bow\", \"lo\")) or nxt.startswith((\"=\", \"(\", \"'\"))\n    for voice, rx, repl, plain in _REGISTER:\n        if variable_like and not rx.pattern.startswith(\"^\" + _NAME):\n            continue                                     # 'report is 5', 'state of x' : the word is a variable\n        m = rx.match(text.strip())\n        if m:\n            return m.expand(repl) if \"\\\\\" in repl else repl\n    return None\n\n\ndef register_note(text):\n    \"\"\"for --explain: 'bump' is an informal way to say 'increase'  (None if the text is not in another voice)\"\"\"\n    t = text.strip()\n    for voice, rx, repl, plain in _REGISTER:\n        m = rx.match(t)\n        if m:\n            groups = m.regs[1:]\n            if not groups:\n                phrase = t\n            elif groups[0][0] > 0:\n                phrase = t[:groups[0][0]].strip(\" ,\")\n            elif len(groups) > 1:\n                phrase = t[groups[0][1]:groups[1][0]].strip()\n            else:\n                phrase = t[groups[0][1]:].strip()\n            say = {\"informal\": \"an informal way\", \"formal\": \"a formal way\", \"old\": \"an old-fashioned way\"}[voice]\n            return f\"'{phrase}' is {say} to say '{plain}'\"\n    return None\n\n\n# --------------------------------------------------------------------------------------------- phrasal verbs (feature 15)\ndef _phrasal(text):\n    t = text\n    t = sub_top(r\"\\badd\\s+up\\b(?=\\s+\\S)\", \"sum of\", t) if first_word(t) != \"add\" else (\n        re.sub(r\"(?i)^(\\s*)add\\s+up\\s+(.+)$\", r\"\\1print sum of \\2\", t))\n    t = sub_top(r\"\\blook\\s+up\\s+(\\\"[^\\\"]*\\\"|[\\w.]+)\\s+in\\s+(?:the\\s+)?(\\w+)\", r\"\\2 at \\1\", t)\n    t = sub_top(r\"\\blook\\s+(\\\"[^\\\"]*\\\"|[\\w.]+)\\s+up\\s+in\\s+(?:the\\s+)?(\\w+)\", r\"\\2 at \\1\", t)\n    t = sub_top(r\"\\bround\\s+up\\b\", \"ceiling of\", t)\n    t = sub_top(r\"\\bround\\s+down\\b\", \"floor of\", t)\n    t = sub_top(r\"\\bround\\s+off\\s+(\\S+)\\s+to\\s+(\\S+)\\s+places?\\b\", r\"rounded \\1 to \\2 places\", t)\n    t = sub_top(r\"\\bround\\s+off\\b\", \"round of\", t)\n    return t\n\n\n# --------------------------------------------------------------------------------------------- the entry points\ndef _sentence(text):\n    text = strip_lead(_strip_punct(strip_lead(text)))\n    if not text:\n        return []\n    text = _contractions(text)\n    text = _fillers(text)\n    if not text:\n        return []\n    text = _comparisons(text)\n    q = _question(text)\n    if q is not None:\n        return q\n    text = sub_top(r\"\\byet\\b\", \"but\", text)\n    if re.search(r\"(?i)\\bnot\\s+only\\b\", text):\n        text = sub_top(r\"\\bnot\\s+only\\b\", \"both\", text)\n        text = sub_top(r\"\\bbut\\s+also\\b\", \"and\", text)\n    if text.endswith(\":\"):\n        return [(0, _finalize(_header(text[:-1].strip()) + \":\"))]\n    return _statement(text)\n\n\n_BLOCK_HEAD = re.compile(r\"(?i)(structurally|simply),\")\n\n\ndef normalize(stmt):\n    \"\"\"one source statement -> [(depth, text), ...]\"\"\"\n    stmt = strip_lead(stmt)\n    if _BLOCK_HEAD.fullmatch(stmt):\n        return [(0, stmt)]\n    out = []\n    for seg in split_top(stmt, \";\"):\n        seg = seg.strip()\n        if seg:\n            out += _sentence(seg)\n    return out\n\n\ndef needs_continuation(stmt):\n    \"\"\"a line that ends in a comma, 'and', 'or' or 'then' goes on the next line\"\"\"\n    s = strip_lead(stmt)\n    if not s or s.endswith(\":\") or _BLOCK_HEAD.fullmatch(s):\n        return False\n    return s.endswith(\",\") or re.search(r\"(?i)\\b(and|or|then)$\", s) is not None\n", "zoomy_grammar.py": "#!/usr/bin/env python3\n\"\"\"\nZoomy 5 grammar layer (introduced in Zoomy 4): English grammar rules with a job to do.\n\n  a / an   Let / Create / Define introduce a NEW name (scope) and its type:  Let a number be called total\n  the      refers to something that already exists:                  add 1 to the total\n  plurals  a plural name holds several things (a list); pair / triple / quad are fixed groups\n  's       possessives reach inside things:                           the player's score, math's sqrt(2)\n  first .. tenth, last   ordinals pick items:                         the third score of the scores\n  is / are, contains / contain   must agree with what the subject is\n\nThe front end (zoomy_py.Front) parses these forms into 'let' / 'decl' nodes and a few extra fields.\nThis module walks the finished statement tree once and\n  * resolves every name with lexical scoping (a block's names end with its indentation),\n  * gives every distinct variable its own unique name, so both back ends (native and Python) see plain variables,\n  * checks types and agreement, with errors that say how to fix the line.\nCode under 'Simply,' follows the old rules (bare names, no checks).\n\"\"\"\nimport difflib\n\nimport zoomy_py as zp\n\nZoomyError = zp.ZoomyError\n\n# ---------------------------------------------------------------------------- plurals\nIRREGULAR = {\"children\": \"child\", \"people\": \"person\", \"men\": \"man\", \"women\": \"woman\", \"mice\": \"mouse\", \"feet\": \"foot\",\n             \"teeth\": \"tooth\", \"geese\": \"goose\", \"indices\": \"index\", \"vertices\": \"vertex\", \"matrices\": \"matrix\",\n             \"axes\": \"axis\", \"criteria\": \"criterion\", \"bases\": \"base\", \"analyses\": \"analysis\", \"leaves\": \"leaf\",\n             \"lives\": \"life\", \"knives\": \"knife\", \"wolves\": \"wolf\", \"halves\": \"half\", \"shelves\": \"shelf\"}\nNOT_PLURAL = {\"news\", \"series\", \"species\", \"lens\", \"bias\", \"canvas\", \"atlas\", \"alias\", \"gas\", \"chaos\", \"this\", \"his\",\n              \"yes\", \"thus\", \"plus\", \"minus\", \"times\", \"its\", \"process\", \"status\", \"class\", \"mass\", \"pass\", \"loss\"}\nITEM_NOUNS = {\"item\", \"element\", \"entry\", \"value\", \"member\", \"thing\", \"one\", \"number\", \"text\"}\n\n\ndef _split(name):\n    head, _, last = name.rpartition(\"_\")\n    return (head + \"_\" if head else \"\"), last\n\n\ndef is_plural(name):\n    last = _split(name)[1].lower()\n    if last in IRREGULAR:\n        return True\n    if len(last) < 3 or last in NOT_PLURAL:\n        return False\n    if last.endswith((\"ss\", \"us\", \"is\", \"ics\")):\n        return False\n    return last.endswith(\"s\")\n\n\ndef singular(name):\n    head, last = _split(name)\n    low = last.lower()\n    if low in IRREGULAR:\n        return head + IRREGULAR[low]\n    if low.endswith(\"ies\") and len(low) > 3:\n        return head + last[:-3] + \"y\"\n    if low.endswith((\"ses\", \"xes\", \"zes\", \"ches\", \"shes\")):\n        return head + last[:-2]\n    if low.endswith(\"s\"):\n        return head + last[:-1]\n    return name\n\n\n# ---------------------------------------------------------------------------- types\n# a type is: None (unknown / any), \"number\", \"text\", \"flag\", \"table\", \"nothing\", \"module\", (\"list\", elem), (\"tuple\", n)\nSCALARS = (\"number\", \"text\", \"flag\")\nTUPLE_NAMES = {2: \"pair\", 3: \"triple\", 4: \"quad\"}\nELEM_NAMES = {\"number\": \"numbers\", \"text\": \"texts\", \"flag\": \"flags\", \"table\": \"tables\", \"mixed\": \"mixed values\"}\n\n\ndef tname(t):\n    if t is None:\n        return \"a value\"\n    if t == \"number\":\n        return \"a number\"\n    if t == \"text\":\n        return \"text\"\n    if t == \"flag\":\n        return \"a yes/no flag\"\n    if t == \"table\":\n        return \"a table\"\n    if t == \"nothing\":\n        return \"nothing\"\n    if t == \"module\":\n        return \"a Python library\"\n    if t[0] == \"tuple\":\n        return \"a \" + TUPLE_NAMES[t[1]]\n    if t[1] is None:\n        return \"a list\"\n    if isinstance(t[1], tuple):\n        return \"a list of lists\"\n    return \"a list of \" + ELEM_NAMES.get(t[1], t[1])\n\n\ndef is_list(t):\n    return isinstance(t, tuple) and t[0] == \"list\"\n\n\ndef is_tuple(t):\n    return isinstance(t, tuple) and t[0] == \"tuple\"\n\n\ndef compat(want, got):\n    \"\"\"can a value of type `got` be kept in a variable of type `want`?\"\"\"\n    if want is None or got is None or want == got:\n        return True\n    if is_list(want) and is_list(got):\n        return want[1] is None or got[1] is None or compat(want[1], got[1]) and got[1] != \"mixed\"\n    return False\n\n\ndef unify(types):\n    known = [t for t in types if t is not None]\n    if not known:\n        return None\n    if len(known) < len(types):\n        return None\n    first = known[0]\n    return first if all(t == first for t in known) else \"mixed\"\n\n\nclass Var:\n    __slots__ = (\"name\", \"py\", \"type\", \"line\", \"scope\", \"extra\")\n\n    def __init__(self, name, py, typ, line, scope):\n        self.name, self.py, self.type, self.line, self.scope, self.extra = name, py, typ, line, scope, None\n\n\nclass Scope:\n    def __init__(self, kind, parent):\n        self.kind, self.parent, self.names = kind, parent, {}\n\n    def lookup(self, name, until=None):\n        s = self\n        while s is not None:\n            if name in s.names:\n                return s.names[name]\n            if s is until:\n                return None\n            s = s.parent\n        return None\n\n    def home(self):\n        s = self\n        while s.kind not in (\"function\", \"program\"):\n            s = s.parent\n        return s\n\n    def visible(self):\n        out, s = [], self\n        while s is not None:\n            out += list(s.names)\n            s = s.parent\n        return out\n\n\n# numeric helpers: name -> (argument types, result type)\nNUM_FN = {\"sqrt\", \"abs\", \"floor\", \"ceil\", \"round\", \"sin\", \"cos\", \"tan\", \"atan\", \"ln\", \"exp\"}\nFN_RESULT = {\"len\": \"number\", \"upper\": \"text\", \"lower\": \"text\", \"trim\": \"text\", \"text\": \"text\", \"numfrom\": \"number\",\n             \"sum\": \"number\", \"keys\": (\"list\", None), \"values\": (\"list\", None), \"lines\": (\"list\", \"text\"),\n             \"code\": \"number\", \"chr\": \"text\", \"rem\": \"number\", \"split\": (\"list\", \"text\"), \"join\": \"text\",\n             \"replace\": \"text\", \"position\": \"number\", \"count\": \"number\", \"format\": \"text\", \"rounded\": \"number\",\n             \"randnum\": \"number\", \"randbetween\": \"number\", \"ask\": \"text\", \"args\": (\"list\", \"text\"),\n             \"exists\": \"flag\", \"now\": \"number\"}\n\n\nclass Resolver:\n    def __init__(self, file):\n        self.file = file\n        self.line = 0\n        self.simply = False\n        self.used = set()\n        self.builtin = Scope(\"builtin\", None)\n        self.program = Scope(\"program\", self.builtin)\n        self.funcs = {}\n        self.init = []                       # start-of-program statements for the variables made with `make ... a global ...`\n        self.externs = set()\n        self.closed = {}\n        self.func_stack = []\n        v = Var(\"input_ok\", \"input_ok\", \"number\", 0, self.builtin)\n        self.builtin.names[\"input_ok\"] = v\n        self.used.add(\"input_ok\")\n        import zoomy_consts\n        for nm in zoomy_consts.NAMES:                      # pi, e, tau, c, G ...: read-only, replaced by numbers after parsing\n            py = zoomy_consts.py_name(nm)\n            self.builtin.names[nm] = Var(nm, py, \"number\", 0, self.builtin)\n            self.used.add(py)\n\n    # ------------------------------------------------------------------ errors\n    def err(self, msg):\n        return ZoomyError(msg, self.file, self.line)\n\n    def terr(self, msg):\n        if not self.simply:\n            raise self.err(msg)\n\n    def soft(self, msg):\n        \"\"\"grammar slips (is/are, ordinal nouns) are warnings; --strict makes them errors\"\"\"\n        if not self.simply:\n            zp.soft(self.file, self.line, msg)\n\n    # ------------------------------------------------------------------ names\n    def fresh(self, name):\n        if name not in self.used:\n            self.used.add(name)\n            return name\n        k = 2\n        while f\"{name}__{k}\" in self.used:\n            k += 1\n        self.used.add(f\"{name}__{k}\")\n        return f\"{name}__{k}\"\n\n    def declare(self, sc, name, typ):\n        if name in self.funcs:\n            raise self.err(f\"'{name}' is already the name of a function; pick another name for the variable\")\n        if name in sc.names:\n            old = sc.names[name]\n            raise self.err(f\"'{name}' already exists here (made on line {old.line}); change it with 'set the {name} to ...' \"\n                           f\"(a new variable of the same name is only allowed inside a deeper block)\")\n        v = Var(name, self.fresh(name), typ, self.line, sc)\n        sc.names[name] = v\n        return v\n\n    def close(self, sc):\n        for nm, v in sc.names.items():\n            self.closed[nm] = v.line\n\n    def undefined(self, name, sc):\n        msg = f\"I don't know a variable called '{name}'\"\n        near = difflib.get_close_matches(name, [n for n in sc.visible() if n != \"input_ok\" and not n.startswith(\"__\")], n=1, cutoff=0.7)\n        if name in self.closed:\n            msg += (f\" at this point: the '{name}' made on line {self.closed[name]} belongs to a block that has ended. \"\n                    f\"Create it before that block (a name lives until the end of the block it was made in)\")\n        elif near:\n            msg += f\". Did you mean '{near[0]}'?\"\n        else:\n            msg += f\". Make it first with: Let a number be called {name}\"\n        return self.err(msg)\n\n    def simply_var(self, name, sc, make=True):\n        \"\"\"Old rules: a bare name means the variable of that name in this function (or program), made if it does not exist.\"\"\"\n        home = sc.home()\n        fn = self.func_stack[-1] if self.func_stack else None\n        if fn is not None and name in fn[\"globals_decl\"]:\n            v = self.program.lookup(name, self.program)\n            if v is None:\n                v = Var(name, self.fresh(name), None, self.line, self.program)\n                self.program.names[name] = v\n            fn[\"globals\"].add(v.py)\n            return v\n        v = sc.lookup(name, home)\n        if v is None and fn is None:\n            v = sc.lookup(name)\n        if v is not None and v.scope.kind == \"builtin\" and v.py.startswith(\"__\"):\n            v = None                                         # old rules: a bare name that is a built-in constant makes a variable\n        if v is None and make:\n            if name in self.funcs:\n                raise self.err(f\"'{name}' is already the name of a function\")\n            v = Var(name, self.fresh(name), None, self.line, home)\n            home.names[name] = v\n        return v\n\n    def note_write(self, v):\n        fn = self.func_stack[-1] if self.func_stack else None\n        if fn is not None and fn[\"kind\"] == \"define\" and v.scope.kind == \"program\":\n            fn[\"globals\"].add(v.py)\n\n    # ------------------------------------------------------------------ expressions\n    def check_assign(self, want, got, what):\n        if not compat(want, got):\n            self.terr(f\"{what} holds {tname(want)}, but this value is {tname(got)}\")\n\n    def expr(self, e, sc):\n        k = e[0]\n        if k == \"num\":\n            return e, \"number\"\n        if k == \"str\":\n            parts = [p if isinstance(p, str) else self.expr(p, sc)[0] for p in e[1]]\n            return [\"str\", parts], \"text\"\n        if k == \"bool\":\n            return e, \"flag\"\n        if k == \"none\":\n            return e, \"nothing\"\n        if k == \"var\":\n            return self.read(e[1], sc)\n        if k in (\"list\", \"tuple\"):\n            res = [self.expr(x, sc) for x in e[1]]\n            items = [r[0] for r in res]\n            if k == \"tuple\":\n                return [\"tuple\", items], (\"tuple\", len(items))\n            return [\"list\", items] + list(e[2:]), (\"list\", unify([r[1] for r in res]))\n        if k == \"table\":\n            return [\"table\", [(self.expr(a, sc)[0], self.expr(b, sc)[0]) for a, b in e[1]]], \"table\"\n        if k == \"bin\":\n            return self.binary(e, sc)\n        if k == \"neg\":\n            a, ta = self.expr(e[1], sc)\n            if ta not in (None, \"number\"):\n                self.terr(f\"cannot negate {tname(ta)} (only numbers)\")\n            return [\"neg\", a], (\"number\" if ta == \"number\" else None)\n        if k == \"bitop\":\n            a, ta = self.expr(e[2], sc)\n            b = self.expr(e[3], sc)[0] if e[3] is not None else None\n            if ta not in (None, \"number\"):\n                self.terr(f\"bit operations need a number, not {tname(ta)}\")\n            return [\"bitop\", e[1], a, b], \"number\"\n        if k == \"not\":\n            return [\"not\", self.expr(e[1], sc)[0]], \"flag\"\n        if k in (\"and\", \"or\"):\n            return [k, self.expr(e[1], sc)[0], self.expr(e[2], sc)[0]], \"flag\"\n        if k == \"cmp\":\n            return self.compare(e, sc)\n        if k == \"is\":\n            a, ta = self.expr(e[2], sc)\n            self.agree(e[2], ta, e[4] if len(e) > 4 else None)\n            return [\"is\", e[1], a, e[3]], \"flag\"\n        if k == \"attr\":\n            a, ta = self.expr(e[1], sc)\n            return [\"attr\", a, e[2]], None\n        if k == \"index\":\n            return self.index(e, sc)\n        if k == \"call\":\n            return self.call(e, sc)\n        if k == \"fn\":\n            return self.function(e, sc)\n        if k in (\"filter\", \"quant\"):\n            return self.element_expr(e, sc)\n        raise self.err(f\"internal error: unknown expression '{k}'\")\n\n    def element_expr(self, e, sc):\n        \"\"\"scores that are above 80   /   all of scores are above 80: a hidden loop variable lives only inside the condition\"\"\"\n        lst_i, cond_i, name = (1, 2, e[3]) if e[0] == \"filter\" else (2, 3, e[4])\n        lst, tl = self.expr(e[lst_i], sc)\n        if is_list(tl):\n            et = tl[1] if tl[1] != \"mixed\" else None\n        elif tl == \"text\":\n            et = \"text\"\n        else:\n            et = None\n            if tl in (\"number\", \"flag\"):\n                self.terr(f\"cannot go through each item of {tname(tl)}\")\n        child = Scope(\"block\", sc)\n        v = Var(name, self.fresh(name), et, self.line, child)\n        child.names[name] = v\n        zp.ELEM_VARS.add(v.py)\n        cond = self.expr(e[cond_i], child)[0]\n        if e[0] == \"filter\":\n            return [\"filter\", lst, cond, v.py], (tl if is_list(tl) else (\"list\", et))\n        return [\"quant\", e[1], lst, cond, v.py], \"flag\"\n\n    def read(self, name, sc):\n        v = sc.lookup(name)\n        if v is None:\n            if name in self.funcs:\n                return [\"var\", name], None\n            if not self.simply and name.lower() in zp.zs.NUMBER_WORDS:        # five, twenty, hundred ... when no variable has that name\n                return [\"num\", float(zp.zs.NUMBER_WORDS[name.lower()])], \"number\"\n            if self.simply:\n                v = self.simply_var(name, sc)\n            else:\n                raise self.undefined(name, sc)\n        return [\"var\", v.py], v.type\n\n    def binary(self, e, sc):\n        op = e[1]\n        a, ta = self.expr(e[2], sc)\n        b, tb = self.expr(e[3], sc)\n        node = [\"bin\", op, a, b]\n        word = {\"plus\": \"add\", \"minus\": \"subtract\", \"times\": \"multiply\", \"divide\": \"divide\", \"mod\": \"take the remainder of\",\n                \"pow\": \"raise to a power\"}[op]\n        if op == \"plus\":\n            if ta == tb and (ta in (\"number\", \"text\") or is_list(ta)):\n                return node, ta\n            if ta is None or tb is None:\n                return node, None\n            self.terr(f\"cannot add {tname(ta)} and {tname(tb)} (to join text and numbers use \\\"{{...}}\\\" inside the text)\")\n            return node, None\n        for t in (ta, tb):\n            if t not in (None, \"number\"):\n                self.terr(f\"cannot {word} {tname(t)}: arithmetic works on numbers\")\n        return node, (\"number\" if ta == \"number\" and tb == \"number\" else None)\n\n    def agree(self, left, ta, cop):\n        \"\"\"is / are, contains / contain must match a list subject (checked for a plain variable subject).\"\"\"\n        if self.simply or cop is None or left[0] != \"var\":\n            return\n        name = left[1]\n        if ta is None or ta == \"nothing\":\n            return\n        if cop == \"are\" and not is_list(ta):\n            self.soft(f\"'{name}' is {tname(ta)}, not a list: say 'is', not 'are'\")\n        elif cop == \"is\" and is_list(ta):\n            self.soft(f\"'{name}' is a list (several things): say 'are', not 'is'\")\n        elif cop == \"contain\" and not is_list(ta):\n            self.soft(f\"'{name}' is {tname(ta)}, not a list: say 'contains', not 'contain'\")\n        # 'contains' is accepted for lists too: 'x must contain y' is rewritten to it and cannot know which fits\n\n    def compare(self, e, sc):\n        op = e[1]\n        a, ta = self.expr(e[2], sc)\n        b, tb = self.expr(e[3], sc)\n        cop = e[4] if len(e) > 4 else None\n        self.agree(e[2], ta, cop)\n        if op in (\"lt\", \"gt\", \"le\", \"ge\"):\n            for t in (ta, tb):\n                if t not in (None, \"number\", \"text\"):\n                    self.terr(f\"cannot order {tname(t)} (only numbers or text can be bigger or smaller)\")\n            if ta and tb and ta != tb:\n                self.terr(f\"cannot compare {tname(ta)} with {tname(tb)}\")\n        elif op in (\"eq\", \"ne\"):\n            if ta not in (None, \"nothing\") and tb not in (None, \"nothing\") and not compat(ta, tb) and not compat(tb, ta):\n                self.terr(f\"comparing {tname(ta)} with {tname(tb)}: they can never be equal\")\n        elif op in (\"starts\", \"ends\"):\n            for t in (ta, tb):\n                if t not in (None, \"text\"):\n                    self.terr(f\"'{op} with' works on text, not {tname(t)}\")\n        return [\"cmp\", op, a, b], \"flag\"\n\n    def index(self, e, sc):\n        cont, tc = self.expr(e[1], sc)\n        key, tk = self.expr(e[2], sc)\n        noun = e[3] if len(e) > 3 else None\n        if noun and not self.simply and e[1][0] == \"var\" and is_plural(e[1][1]) and noun not in ITEM_NOUNS \\\n                and noun != singular(e[1][1]):\n            self.soft(f\"'{noun}' does not fit '{e[1][1]}': say 'the ... {singular(e[1][1])} of the {e[1][1]}' (or 'item')\")\n        node = [\"index\", cont, key]\n        if tc is None:\n            return node, None\n        if tc == \"table\":\n            return node, None\n        if is_list(tc) or is_tuple(tc) or tc == \"text\":\n            if tk not in (None, \"number\"):\n                self.terr(f\"an item number must be a number, not {tname(tk)}\")\n            if is_tuple(tc) and key[0] == \"num\" and not 0 <= key[1] < tc[1]:\n                self.terr(f\"{tname(tc)} has only {tc[1]} parts (numbered 0 to {tc[1] - 1})\")\n            return node, (\"text\" if tc == \"text\" else tc[1] if is_list(tc) else None)\n        self.terr(f\"{tname(tc)} has no items to pick from\")\n        return node, None\n\n    def call(self, e, sc):\n        f, args, kw = e[1], e[2], e[3]\n        res = [self.expr(x, sc) for x in args]\n        kws = [(n, self.expr(v, sc)[0]) for n, v in kw]\n        argn = [r[0] for r in res]\n        if f[0] == \"var\" and f[1] in self.funcs and sc.lookup(f[1]) is None:\n            info = self.funcs[f[1]]\n            if info[\"kind\"] == \"define\" and len(argn) == len(info[\"params\"]):\n                for (pn, pt), (_, at) in zip(info[\"params\"], res):\n                    if not compat(pt, at):\n                        self.terr(f\"'{f[1]}' wants {pn} to be {tname(pt)}, but this is {tname(at)}\")\n            return [\"call\", [\"var\", f[1]], argn, kws], None\n        fn, _ = self.expr(f, sc)\n        return [\"call\", fn, argn, kws], None\n\n    def function(self, e, sc):\n        op = e[1]\n        res = [self.expr(x, sc) for x in e[2]]\n        args = [r[0] for r in res]\n        types = [r[1] for r in res]\n        node = [\"fn\", op, args] + list(e[3:])\n        t0 = types[0] if types else None\n        if op in NUM_FN or op == \"rem\":\n            for t in types:\n                if t not in (None, \"number\"):\n                    self.terr(f\"this needs a number, not {tname(t)}\")\n            return node, \"number\"\n        if op in (\"upper\", \"lower\", \"trim\"):\n            if t0 not in (None, \"text\"):\n                self.terr(f\"this needs text, not {tname(t0)}\")\n            return node, \"text\"\n        if op == \"len\" and t0 not in (None, \"text\", \"table\") and not is_list(t0) and not is_tuple(t0):\n            self.terr(f\"{tname(t0)} has no length\")\n        if op in (\"sorted\", \"reversed\", \"slice\"):\n            return node, t0 if (is_list(t0) or t0 == \"text\") else None\n        if op in (\"first\", \"last\", \"min\", \"max\"):\n            if is_list(t0):\n                return node, t0[1] if t0[1] != \"mixed\" else None\n            return node, (\"text\" if (t0 == \"text\" and op in (\"first\", \"last\")) else None)\n        if op == \"sum\" and t0 is not None and not is_list(t0) and not is_tuple(t0):\n            self.terr(f\"cannot add up {tname(t0)}\")\n        return node, FN_RESULT.get(op)\n\n    # ------------------------------------------------------------------ places (things that can be written)\n    def coerce(self, vnode, vt, want):\n        \"\"\"a list written with commas becomes a pair/triple/quad when the variable is one\"\"\"\n        if is_tuple(want) and vnode[0] in (\"list\", \"tuple\") and vt != want:\n            n = want[1]\n            if len(vnode[1]) != n:\n                self.terr(f\"{tname(want)} needs exactly {n} values, but {len(vnode[1])} are given\")\n            else:\n                return [\"tuple\", vnode[1]], want\n        return vnode, vt\n\n    def assign(self, place, vnode, vt, sc):\n        \"\"\"-> (place node, value node)\"\"\"\n        k = place[0]\n        if k == \"decl\":                          # old rules ('Simply,'): a bare name makes the variable when it is new\n            v = self.simply_var(place[1], sc)\n            return [\"var\", v.py], vnode\n        if k == \"var\":\n            v = sc.lookup(place[1])\n            if v is None:\n                if self.simply:\n                    v = self.simply_var(place[1], sc)\n                else:\n                    raise self.undefined(place[1], sc)\n            if v.scope.kind == \"builtin\" and v.py.startswith(\"__\"):\n                if self.simply:                            # Simply, c = 5 makes a variable called c\n                    home = sc.home()\n                    v = Var(place[1], self.fresh(place[1]), None, self.line, home)\n                    home.names[place[1]] = v\n                else:\n                    raise self.err(f\"'{v.name}' is a built-in constant and cannot be changed (make your own variable of that \"\n                                   f\"name with 'Let a number be called {v.name}' if you need one)\")\n            vnode, vt = self.coerce(vnode, vt, v.type)\n            self.check_assign(v.type, vt, f\"'{v.name}'\")\n            self.note_write(v)\n            return [\"var\", v.py], vnode\n        if k == \"index\":\n            cont, tc = self.expr(place[1], sc)\n            key, tk = self.expr(place[2], sc)\n            self.check_mutable(tc, \"change an item of\")\n            if tc == \"text\":\n                self.terr(\"text cannot be changed letter by letter (build new text instead)\")\n            elif is_list(tc):\n                self.check_assign(tc[1] if tc[1] != \"mixed\" else None, vt, \"an item of this list\")\n            return [\"index\", cont, key], vnode\n        if k == \"attr\":\n            base, tb = self.expr(place[1], sc)\n            return [\"attr\", base, place[2]], vnode\n        raise self.err(\"this cannot be changed\")\n\n    def check_mutable(self, t, what):\n        if is_tuple(t):\n            self.terr(f\"{tname(t)} is a fixed group and cannot {what} it (use a list if it must change)\")\n        elif t in SCALARS:\n            self.terr(f\"cannot {what} {tname(t)}\")\n\n    # ------------------------------------------------------------------ statements\n    def block(self, stmts, sc):\n        out = []\n        for s in stmts:\n            out += self.stmt(s, sc)\n        return out\n\n    def sub(self, stmts, sc, kind=\"block\"):\n        child = Scope(kind, sc)\n        try:\n            return self.block(stmts, child), child\n        finally:\n            self.close(child)\n\n    def stmt(self, s, sc):\n        self.line = s[1] if len(s) > 1 and isinstance(s[1], int) else self.line\n        m = getattr(self, \"r_\" + s[0], None)\n        if m is None:\n            return [s]\n        out = m(s, sc)\n        return out if isinstance(out, list) and (not out or isinstance(out[0], list)) else [out]\n\n    @staticmethod\n    def default_value(typ):\n        if typ in (None, \"nothing\"):\n            return [\"none\"]\n        if typ == \"number\":\n            return [\"num\", 0.0]\n        if typ == \"text\":\n            return [\"str\", [\"\"]]\n        if typ == \"flag\":\n            return [\"bool\", False]\n        if typ == \"table\":\n            return [\"table\", []]\n        if is_list(typ):\n            return [\"list\", []]\n        return [\"tuple\", [[\"num\", 0.0]] * typ[1]]\n\n    def r_let(self, s, sc):\n        \"\"\"Let a number be called total  ->  the variable exists (with its default value) from here to the end of the block\n        make total a global number    ->  the variable exists for the whole program (it was made when the file was scanned,\n                                          and is given its default value once, when the program starts)\"\"\"\n        name, ty, slots = s[2], s[3], s[4]\n        typ = None if ty == \"value\" else ty\n        if len(s) > 5 and s[5] == \"global\":\n            return []\n        shared = len(s) > 5 and s[5] == \"shared\"\n        n = None\n        if slots is not None:\n            n, tn = self.expr(slots, sc)\n            if tn not in (None, \"number\"):\n                self.terr(f\"the number of slots must be a number, not {tname(tn)}\")\n        v = self.declare(sc, name, typ)\n        if n is not None:\n            return [[\"alloc\", s[1], v.py, n] + ([\"shared\"] if shared else [])]\n        return [[\"set\", s[1], [\"var\", v.py], self.default_value(typ)]]\n\n    def make_globals(self, stmts):\n        \"\"\"`make NAME a global TYPE` anywhere in a file (even inside a function) makes NAME a variable of the whole program.\n        It is made before anything else is read, so code written above the `make` line can already use it.\"\"\"\n        for s in stmts:\n            if s[0] == \"let\" and len(s) > 5 and s[5] == \"global\":\n                self.line = s[1]\n                typ = None if s[3] == \"value\" else s[3]\n                v = self.declare(self.program, s[2], typ)\n                if s[4] is not None:\n                    n, tn = self.expr(s[4], self.program)\n                    if tn not in (None, \"number\"):\n                        self.terr(f\"the number of slots must be a number, not {tname(tn)}\")\n                    self.init.append([\"alloc\", s[1], v.py, n])\n                else:\n                    self.init.append([\"set\", s[1], [\"var\", v.py], self.default_value(typ)])\n            for blk in zp.nested_blocks(s):\n                self.make_globals(blk)\n\n    def r_set(self, s, sc):\n        val, vt = self.expr(s[3], sc)\n        tgt, val = self.assign(s[2], val, vt, sc)\n        return [[\"set\", s[1], tgt, val]]\n\n    def r_aug(self, s, sc):\n        op = s[2]\n        val, vt = self.expr(s[3], sc)\n        tgt, ttype = self.target_read(s[4], sc)\n        if op == \"add\" and ttype == \"text\":\n            if vt not in (None, \"text\"):\n                self.terr(f\"cannot add {tname(vt)} to text\")\n        else:\n            if is_list(ttype):\n                self.terr(\"a list is not a number: to put something on a list say 'append ... to the list'\")\n            for t in (ttype, vt):\n                if t not in (None, \"number\"):\n                    self.terr(f\"{'add' if op == 'add' else 'subtract' if op == 'sub' else 'multiply' if op == 'mul' else 'divide'} \"\n                              f\"works on numbers, but this is {tname(t)}\")\n        tnode, _ = self.assign(s[4], [\"num\", 0.0], \"number\" if ttype in (None, \"number\") else ttype, sc)\n        return [[\"aug\", s[1], op, val, tnode]]\n\n    def target_read(self, place, sc):\n        \"\"\"type of an existing place (for + - * / on it)\"\"\"\n        if place[0] == \"decl\":\n            v = self.simply_var(place[1], sc) if place[3] == \"simply\" else None\n            if v is None:\n                raise self.err(f\"'{place[1]}' is new, so there is nothing to add to yet (give it a value first)\")\n            return None, v.type\n        node, t = self.expr(place, sc)\n        return node, t\n\n    def r_calc(self, s, sc):\n        val, vt = self.expr(s[2], sc)\n        tgt, val = self.assign(s[3], val, vt, sc)\n        return [[\"calc\", s[1], val, tgt]]\n\n    def r_alloc(self, s, sc):\n        n, tn = self.expr(s[3], sc)\n        if tn not in (None, \"number\"):\n            self.terr(\"the number of slots must be a number\")\n        v = self.simply_var(s[2][1], sc)\n        return [[\"alloc\", s[1], v.py, n]]\n\n    def r_store(self, s, sc):\n        cont, tc = self.expr(s[2], sc)\n        key, tk = self.expr(s[3], sc)\n        val, vt = self.expr(s[4], sc)\n        self.check_mutable(tc, \"change an item of\")\n        if is_list(tc):\n            self.check_assign(tc[1] if tc[1] != \"mixed\" else None, vt, \"an item of this list\")\n        return [[\"store\", s[1], cont, key, val] + list(s[5:])]\n\n    def r_load(self, s, sc):\n        cont, tc = self.expr(s[2], sc)\n        key, tk = self.expr(s[3], sc)\n        et = tc[1] if is_list(tc) and tc[1] != \"mixed\" else (\"text\" if tc == \"text\" else None)\n        tgt, _ = self.assign(s[4], [\"num\", 0.0], et, sc)\n        return [[\"load\", s[1], cont, key, tgt]]\n\n    def r_read(self, s, sc):\n        et = \"text\" if s[2] == \"line\" else \"number\"\n        tgt, _ = self.assign(s[3], [\"num\", 0.0], et, sc)\n        return [[\"read\", s[1], s[2], tgt]]\n\n    def r_readfile(self, s, sc):\n        path, _ = self.expr(s[2], sc)\n        tgt, _ = self.assign(s[3], [\"num\", 0.0], \"text\", sc)\n        return [[\"readfile\", s[1], path, tgt]]\n\n    def r_writefile(self, s, sc):\n        return [[\"writefile\", s[1], s[2], self.expr(s[3], sc)[0], self.expr(s[4], sc)[0]]]\n\n    def r_print(self, s, sc):\n        return [[\"print\", s[1], s[2], [[kind, self.expr(e, sc)[0]] for kind, e in s[3]]]]\n\n    def r_if(self, s, sc):\n        cond, _ = self.expr(s[2], sc)\n        body, _ = self.sub(s[3], sc)\n        orelse = None\n        if s[4] is not None:\n            orelse, _ = self.sub(s[4], sc)\n        return [[\"if\", s[1], cond, body, orelse] + list(s[5:])]\n\n    def r_while(self, s, sc):\n        cond, _ = self.expr(s[2], sc)\n        body, _ = self.sub(s[3], sc)\n        return [[\"while\", s[1], cond, body]]\n\n    def r_repeat(self, s, sc):\n        n = None\n        if s[2] is not None:\n            n, tn = self.expr(s[2], sc)\n            if tn not in (None, \"number\"):\n                self.terr(f\"'repeat' needs a number of times, not {tname(tn)}\")\n        body, _ = self.sub(s[3], sc)\n        return [[\"repeat\", s[1], n, body]]\n\n    def loop_body(self, decl, typ, stmts, sc):\n        child = Scope(\"block\", sc)\n        name = decl[1]\n        if name in self.funcs:\n            raise self.err(f\"'{name}' is already the name of a function\")\n        v = Var(name, self.fresh(name), typ, self.line, child)\n        child.names[name] = v\n        try:\n            return v.py, self.block(stmts, child)\n        finally:\n            self.close(child)\n\n    def r_foreach(self, s, sc):\n        it, ti = self.expr(s[3], sc)\n        if is_list(ti):\n            et = ti[1] if ti[1] != \"mixed\" else None\n        elif ti == \"text\":\n            et = \"text\"\n        else:\n            et = None\n            if ti in (\"number\", \"flag\"):\n                self.terr(f\"cannot go through each item of {tname(ti)}\")\n        name, body = self.loop_body(s[2], et, s[4], sc)\n        return [[\"foreach\", s[1], name, it, body]]\n\n    def r_for(self, s, sc):\n        a, ta = self.expr(s[3], sc)\n        z, tz = self.expr(s[4], sc)\n        st = self.expr(s[5], sc)[0] if s[5] else None\n        for t in (ta, tz):\n            if t not in (None, \"number\"):\n                self.terr(f\"'for ... from ... to ...' counts numbers, not {tname(t)}\")\n        name, body = self.loop_body(s[2], \"number\", s[6], sc)\n        return [[\"for\", s[1], name, a, z, st, body]]\n\n    def r_return(self, s, sc):\n        return [[\"return\", s[1], self.expr(s[2], sc)[0] if s[2] else None]]\n\n    def r_workers(self, s, sc):\n        n, tn = self.expr(s[2], sc)\n        if tn not in (None, \"number\"):\n            self.terr(\"the number of workers must be a number\")\n        tgt, _ = self.assign(s[3], [\"num\", 0.0], \"number\", sc)\n        return [[\"workers\", s[1], n, tgt]]\n\n    def r_fsize(self, s, sc):\n        tgt, _ = self.assign(s[2], [\"num\", 0.0], \"number\", sc)\n        return [[\"fsize\", s[1], tgt]]\n\n    def r_seekf(self, s, sc):\n        pos, _ = self.expr(s[2], sc)\n        return [[\"seekf\", s[1], pos]]\n\n    def r_syscall(self, s, sc):\n        num, _ = self.expr(s[2], sc)\n        args = [self.expr(a, sc)[0] for a in s[3]]\n        tgt = None\n        if s[4] is not None:\n            tgt, _ = self.assign(s[4], [\"num\", 0.0], \"number\", sc)\n        return [[\"syscall\", s[1], num, args, tgt]]\n\n    def r_clock(self, s, sc):\n        tgt, _ = self.assign(s[2], [\"num\", 0.0], \"number\", sc)\n        return [[\"clock\", s[1], tgt] + list(s[3:])]\n\n    def r_openf(self, s, sc):\n        path, _ = self.expr(s[2], sc)\n        return [[\"openf\", s[1], path]]\n\n    def r_openarr(self, s, sc):\n        arr, _ = self.expr(s[2], sc)\n        return [[\"openarr\", s[1], arr]]\n\n    def r_closef(self, s, sc):\n        return [[\"closef\", s[1]]]\n\n    def r_waitw(self, s, sc):\n        return [[\"waitw\", s[1]]]\n\n    def r_finish(self, s, sc):\n        e = None\n        if s[2]:\n            e, te = self.expr(s[2], sc)\n            if te not in (None, \"number\"):\n                self.terr(f\"'finish with' needs a number, not {tname(te)}\")\n        return [[\"finish\", s[1], e]]\n\n    def r_fail(self, s, sc):\n        return [[\"fail\", s[1], self.expr(s[2], sc)[0]]]\n\n    def r_warn(self, s, sc):\n        return [[\"warn\", s[1], self.expr(s[2], sc)[0]]]\n\n    def r_check(self, s, sc):\n        return [[\"check\", s[1], self.expr(s[2], sc)[0], s[3]]]\n\n    def r_exprstmt(self, s, sc):\n        return [[\"exprstmt\", s[1], self.expr(s[2], sc)[0]]]\n\n    def r_callstore(self, s, sc):\n        val, vt = self.expr(s[2], sc)\n        tgt, _ = self.assign(s[3], val, vt, sc)\n        return [[\"callstore\", s[1], val, tgt]]\n\n    def r_runwith(self, s, sc):\n        return [[\"runwith\", s[1], s[2], self.expr(s[3], sc)[0]]]\n\n    def r_convert(self, s, sc):\n        val, tv = self.expr(s[3], sc)\n        if tv not in (None, \"number\", \"text\"):\n            self.terr(f\"cannot convert {tname(tv)} this way\")\n        tgt, _ = self.assign(s[4], [\"num\", 0.0], \"number\" if s[2] == \"character\" else \"text\", sc)\n        return [[\"convert\", s[1], s[2], val, tgt]]\n\n    def r_use(self, s, sc):\n        name = s[3]\n        old = sc.lookup(name, sc)\n        if old is not None and old.type == \"module\" and old.extra == s[2]:\n            return []\n        v = self.declare(sc, name, \"module\")\n        v.extra = s[2]\n        return [[\"use\", s[1], s[2], v.py]]\n\n    def r_usefrom(self, s, sc):\n        names = []\n        for nm in s[3]:\n            v = self.declare(sc, nm, None)\n            names.append(v.py)\n        return [[\"usefrom\", s[1], s[2], names, list(s[3])]]\n\n    def r_global(self, s, sc):\n        fn = self.func_stack[-1] if self.func_stack else None\n        names = []\n        for nm in s[2]:\n            if fn is not None:\n                fn[\"globals_decl\"].add(nm)\n            v = self.program.lookup(nm, self.program)\n            if v is None:\n                v = Var(nm, self.fresh(nm), None, self.line, self.program)\n                self.program.names[nm] = v\n            if fn is not None:\n                fn[\"globals\"].add(v.py)\n            names.append(v.py)\n        return [[\"global\", s[1], names]]\n\n    def r_extern(self, s, sc):\n        self.externs.add(s[2])\n        return [s]\n\n    def list_target(self, e, sc, what):\n        node, t = self.expr(e, sc)\n        if t not in (None,) and not is_list(t) and t != \"table\":\n            self.terr(f\"cannot {what} {tname(t)}: it is not a list\")\n        self.check_mutable(t, what)\n        return node, t\n\n    def r_append(self, s, sc):\n        val, vt = self.expr(s[2], sc)\n        tgt, tt = self.list_target(s[3], sc, \"add to\")\n        if is_list(tt):\n            self.check_assign(tt[1] if tt[1] != \"mixed\" else None, vt, \"this list\")\n        return [[\"append\", s[1], val, tgt]]\n\n    def r_insert(self, s, sc):\n        val, vt = self.expr(s[2], sc)\n        tgt, tt = self.list_target(s[3], sc, \"insert into\")\n        if is_list(tt):\n            self.check_assign(tt[1] if tt[1] != \"mixed\" else None, vt, \"this list\")\n        return [[\"insert\", s[1], val, tgt, self.expr(s[4], sc)[0]]]\n\n    def r_remove(self, s, sc):\n        val, _ = self.expr(s[2], sc)\n        return [[\"remove\", s[1], val, self.list_target(s[3], sc, \"remove from\")[0]]]\n\n    def r_removeat(self, s, sc):\n        idx, _ = self.expr(s[2], sc)\n        return [[\"removeat\", s[1], idx, self.list_target(s[3], sc, \"remove from\")[0]]]\n\n    def r_sort(self, s, sc):\n        return [[\"sort\", s[1], self.list_target(s[2], sc, \"sort\")[0], s[3]]]\n\n    def r_reverse(self, s, sc):\n        return [[\"reverse\", s[1], self.list_target(s[2], s 0\n\n    def __ge__(self, o):\n        return _bd_cmp(self, _bd_coerce(o)) >= 0\n\n    def __hash__(self):\n        return hash((self.s, self.m, self.e))\n\n    def __float__(self):\n        if self.m == 0:\n            return 0.0\n        try:\n            v = _zmath.ldexp(float(self.m >> (_BD_BITS - 60)), self.e + _BD_BITS - 60)\n        except OverflowError:\n            v = _INF\n        return -v if self.s else v\n\n    def __int__(self):\n        i, _ = _bd_intpart(self)\n        return -i if self.s else i\n\n    def __index__(self):\n        i, frac = _bd_intpart(self)\n        if frac:\n            raise ZoomyRuntimeError(\"expected a whole number but got \" + _bd_str(self))\n        return -i if self.s else i\n\n\n_BD_ZERO = _BD(0, 0, 0)\n\n\ndef _bd_make(s, n, e):\n    \"\"\"the number n * 2**e (n >= 0 a whole number), cut to 1024 bits\"\"\"\n    if n == 0:\n        return _BD_ZERO\n    ln = n.bit_length()\n    if ln > _BD_BITS:\n        n >>= ln - _BD_BITS\n        e += ln - _BD_BITS\n    elif ln < _BD_BITS:\n        n <<= _BD_BITS - ln\n        e -= _BD_BITS - ln\n    if e > _BD_EMAX:\n        raise ZoomyRuntimeError(\"a Big Decimal got too large (more than about 1e616)\")\n    if e < _BD_EMIN:\n        return _BD_ZERO\n    return _BD(s, n, e)\n\n\ndef _bd_from_int(v):\n    return _bd_make(1 if v < 0 else 0, abs(v), 0)\n\n\ndef _bd_from_fraction(num, den):\n    \"\"\"num / den (den > 0), cut toward zero\"\"\"\n    s = 1 if num < 0 else 0\n    num = abs(num)\n    if num == 0:\n        return _BD_ZERO\n    t = max(0, _BD_BITS + 6 + den.bit_length() - num.bit_length())\n    return _bd_make(s, (num << t) // den, -t)\n\n\ndef _bd_from_text(text):\n    \"\"\"a decimal number written as text ('0.1', '-6.62607015e-34'), exactly as the compiler reads it\"\"\"\n    import fractions\n    f = fractions.Fraction(text)\n    return _bd_from_fraction(f.numerator, f.denominator)\n\n\n_bd_cache = {}\n\n\ndef _bdlit(n, d):\n    k = (n, d)\n    v = _bd_cache.get(k)\n    if v is None:\n        v = _bd_cache[k] = _bd_from_fraction(n, d)\n    return v\n\n\ndef _bd_coerce(o):\n    if type(o) is _BD:\n        return o\n    if isinstance(o, bool):\n        return _bd_from_int(int(o))\n    if isinstance(o, int):\n        return _bd_from_int(o)\n    if isinstance(o, float):\n        if o != o or o in (_INF, -_INF):\n            raise ZoomyRuntimeError(\"a Big Decimal cannot hold infinity or not-a-number\")\n        n, d = o.as_integer_ratio()\n        return _bd_from_fraction(n, d)\n    raise ZoomyRuntimeError(\"expected a number but got \" + _zkind(o))\n\n\ndef _bd_neg(x):\n    return _BD(1 - x.s, x.m, x.e) if x.m else x\n\n\ndef _bd_cmp(a, b):\n    ka, kb = a._key(), b._key()\n    return (ka > kb) - (ka < kb)\n\n\ndef _bd_add(a, b):\n    if a.m == 0:\n        return b\n    if b.m == 0:\n        return a\n    gap = a.e - b.e\n    if gap > _BD_ALIGN:\n        return a\n    if gap < -_BD_ALIGN:\n        return b\n    e0 = min(a.e, b.e)\n    x = (a.m << (a.e - e0)) * (-1 if a.s else 1) + (b.m << (b.e - e0)) * (-1 if b.s else 1)\n    return _bd_make(1 if x < 0 else 0, abs(x), e0)\n\n\ndef _bd_mul(a, b):\n    if a.m == 0 or b.m == 0:\n        return _BD_ZERO\n    return _bd_make(a.s ^ b.s, a.m * b.m, a.e + b.e)\n\n\ndef _bd_div(a, b):\n    if b.m == 0:\n        raise ZoomyRuntimeError(\"division by zero\")\n    if a.m == 0:\n        return _BD_ZERO\n    return _bd_make(a.s ^ b.s, (a.m << _BD_BITS) // b.m, a.e - b.e - _BD_BITS)\n\n\ndef _bd_intpart(x):\n    \"\"\"(the whole part of |x|, whether |x| has a fractional part)\"\"\"\n    if x.m == 0:\n        return 0, False\n    if x.e >= 0:\n        return x.m << x.e, False\n    sh = -x.e\n    if sh > _BD_BITS:\n        return 0, True\n    return x.m >> sh, (x.m & ((1 << sh) - 1)) != 0\n\n\ndef _bd_floor(x):\n    x = _bd_coerce(x)\n    i, frac = _bd_intpart(x)\n    return _bd_from_int(-(i + frac) if x.s else i)\n\n\ndef _bd_ceil(x):\n    x = _bd_coerce(x)\n    i, frac = _bd_intpart(x)\n    return _bd_from_int(-i if x.s else i + frac)\n\n\ndef _bd_trunc(x):\n    i, _ = _bd_intpart(x)\n    return _bd_from_int(-i if x.s else i)\n\n\ndef _bd_round(x):                                          # halves round away from zero\n    x = _bd_coerce(x)\n    if x.m == 0:\n        return x\n    i, _ = _bd_intpart(x)\n    sh = -x.e\n    if 1 <= sh <= _BD_BITS and (x.m >> (sh - 1)) & 1:\n        i += 1\n    return _bd_from_int(-i if x.s else i)\n\n\ndef _bd_mod(a, b):                                         # a - b * floor(a / b)\n    a, b = _bd_coerce(a), _bd_coerce(b)\n    return a - b * _bd_floor(a / b)\n\n\ndef _bd_rem(a, b):                                         # the remainder with the sign of a\n    a, b = _bd_coerce(a), _bd_coerce(b)\n    return a - b * _bd_trunc(a / b)\n\n\ndef _bd_sqrt(x):\n    x = _bd_coerce(x)\n    if x.m == 0:\n        return x\n    if x.s:\n        raise ZoomyRuntimeError(\"the square root of a negative number\")\n    m, e = x.m, x.e\n    if e & 1:\n        m <<= 1\n        e -= 1\n    return _bd_make(0, _zmath.isqrt(m << _BD_BITS), (e - _BD_BITS) // 2)\n\n\ndef _bd_pow(a, b):\n    a, b = _bd_coerce(a), _bd_coerce(b)\n    n, frac = _bd_intpart(b)\n    if frac:\n        raise ZoomyRuntimeError(\"Big Decimals can only be raised to whole-number powers\")\n    r, x = _bd_from_int(1), a\n    k = n\n    while k:\n        if k & 1:\n            r = _bd_mul(r, x)\n        k >>= 1\n        if k:\n            x = _bd_mul(x, x)\n    return _bd_div(_bd_from_int(1), r) if b.s and n else r\n\n\ndef _bd_str(x):\n    \"\"\"the number as plain decimal text: at most 110 significant digits (rounded), no trailing zeros, never an exponent\"\"\"\n    if x.m == 0:\n        return \"0\"\n    i, _ = _bd_intpart(x)\n    D = _BD_DIGITS\n    digs = list(str(i)) if i else []\n    point = len(digs)                                      # digits before the decimal point\n    if x.e < 0:\n        k = -x.e\n        f = x.m & ((1 << k) - 1) if k <= _BD_BITS else x.m\n        zeros
