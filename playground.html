7203091798057628621354486227052604628189024497072072041893911374\", \"(1 + sqrt 5) / 2\"),\n    \"ln2\": (\"0.6931471805599453094172321214581765680755001343602552541206800094933936219696947156058633269964186875420014810205706857336855202357581305570326707516350759619307275708283714351903070386238916734711233501153644979552391204751726815749320651555247341395258829504530070953263666426541042391578149520437404303855008019441706416715186447128399681\", \"the natural logarithm of 2\"),\n    \"ln10\": (\"2.3025850929940456840179914546843642076011014886287729760333279009675726096773524802359972050895982983\", \"the natural logarithm of 10\"),\n    \"euler_gamma\": (\"0.5772156649015328606065120900824024310421593359399235988057672348848677267776646709369470632917467495\", \"the Euler-Mascheroni constant\"),\n    \"catalan\": (\"0.9159655941772190150546035149323841107741493742816721342664981196217630197762547694793565129261151062\", \"Catalan's constant\"),\n    \"speed_of_light\": (\"299792458\", \"metres per second (exact)\"),\n    \"gravitational_constant\": (\"6.67430e-11\", \"G, in m^3 kg^-1 s^-2 (CODATA 2018)\"),\n    \"planck_constant\": (\"6.62607015e-34\", \"h, in joule seconds (exact)\"),\n    \"reduced_planck_constant\": (\"1.054571817646156e-34\", \"hbar = h / 2 pi, in joule seconds\"),\n    \"standard_gravity\": (\"9.80665\", \"g, metres per second squared (exact)\"),\n    \"boltzmann_constant\": (\"1.380649e-23\", \"joules per kelvin (exact)\"),\n    \"avogadro_constant\": (\"6.02214076e23\", \"per mole (exact)\"),\n    \"elementary_charge\": (\"1.602176634e-19\", \"coulombs (exact)\"),\n    \"gas_constant\": (\"8.31446261815324\", \"joules per mole kelvin (exact)\"),\n    \"stefan_boltzmann_constant\": (\"5.670374419184429e-8\", \"watts per square metre kelvin^4\"),\n    \"vacuum_permittivity\": (\"8.8541878188e-12\", \"farads per metre (CODATA 2022)\"),\n    \"vacuum_permeability\": (\"1.25663706127e-6\", \"newtons per ampere squared (CODATA 2022)\"),\n    \"fine_structure_constant\": (\"7.2973525643e-3\", \"no unit (CODATA 2022)\"),\n    \"electron_mass\": (\"9.1093837139e-31\", \"kilograms (CODATA 2022)\"),\n    \"proton_mass\": (\"1.67262192595e-27\", \"kilograms (CODATA 2022)\"),\n    \"neutron_mass\": (\"1.67492750056e-27\", \"kilograms (CODATA 2022)\"),\n    \"atomic_mass_unit\": (\"1.66053906892e-27\", \"kilograms (CODATA 2022)\"),\n    \"earth_mass\": (\"5.9722e24\", \"kilograms\"),\n    \"earth_radius\": (\"6371000\", \"metres (mean radius)\"),\n    \"solar_mass\": (\"1.98841e30\", \"kilograms\"),\n    \"astronomical_unit\": (\"149597870700\", \"metres (exact)\"),\n    \"light_year\": (\"9460730472580800\", \"metres (exact)\"),\n    \"parsec\": (\"3.0856775814913673e16\", \"metres\"),\n}\n\n# short names for the best known ones\nALIASES = {\"phi\": \"golden_ratio\", \"G\": \"gravitational_constant\", \"g\": \"standard_gravity\", \"c\": \"speed_of_light\",\n           \"h\": \"planck_constant\", \"hbar\": \"reduced_planck_constant\"}\n\nNAMES = {**{k: k for k in CONSTANTS}, **ALIASES}          # every name a program can use -> its canonical name\n\n\ndef py_name(name):\n    \"\"\"the name the front end gives the built-in variable (no user name starts with two underscores)\"\"\"\n    return \"__\" + NAMES[name]\n\n\nPY_NAMES = {\"__\" + k: k for k in CONSTANTS}\n\n\ndef value(py):\n    return float(CONSTANTS[PY_NAMES[py]][0])\n\n\ndef text(py):\n    \"\"\"the constant exactly as written in the table (all its digits)\"\"\"\n    return CONSTANTS[PY_NAMES[py]][0]\n\n\ndef whole(py):\n    \"\"\"the constant as a whole number (cut toward zero), or None when it does not fit in 64 bits\"\"\"\n    n = int(float(CONSTANTS[PY_NAMES[py]][0]))\n    return n if -(1 << 63) <= n < (1 << 63) else None\n", "zoomy_fmt.py": "\"\"\"Zoomy 8: `zoomy.py fmt` - one consistent style for Zoomy source.\n\nWhat it does (and only this):\n  * a line that is already plain is kept word for word; it is only re-indented to 4 spaces per level;\n  * a line in another voice (`bump x by 3`, `print x if x is 3`, `loop 5 times:`, `Kindly initialise x to 4`, several actions on one line)\n    is rewritten as the plain statements the sentence layer reads it as (the same text `--explain` shows);\n  * comments stay (a whole-line comment goes with the statement below it, a trailing comment stays at the end of the line);\n  * runs of blank lines become one, trailing spaces go, the file ends with one newline.\nIt never changes what a program does: unless told not to, `format_file` compiles the original and the formatted text and\nrefuses to produce the result when the generated code differs.\"\"\"\nimport os\nimport re\n\nimport zoomy_py\nimport zoomy_sentence as zs\n\n\ndef _compile(text, filename):\n    \"\"\"the generated Python without line numbers, or the error text - for comparing\"\"\"\n    try:\n        prog = zoomy_py.Program(filename)\n        prog.load_text(text, filename)\n        src, _ = zoomy_py.compile_python(prog)\n        src = re.sub(r\"__q\\d+\", \"__q\", src)                  # the numbers of the hidden question variables count up per process\n        return \"ok\", \"\\n\".join(l for l in src.splitlines() if not l.startswith((\"_ZLINES\", \"_ZNAME\")))\n    except zoomy_py.ZoomyError as e:\n        return \"error\", re.sub(r\"\\bline \\d+|:\\d+:\", \"\", str(e))\n    except Exception as e:                                         # a program the front end cannot take at all\n        return \"error\", type(e).__name__\n\n\ndef _internal(t):\n    \"\"\"sentences the sentence layer hands to later stages in an inner wording (questions, 'must contain' checks): never shown to people\"\"\"\n    return t.startswith((\"__\", \"check that\", \"warn with\")) or t.endswith(\".:\")\n\n\ndef format_text(text, filename=\"program\", frozen=(), rewritten=None):\n    \"\"\"the formatted text; raises ZoomyError if the program cannot even be read.\n    frozen: first-line numbers of statements that must stay as written; rewritten: a list that collects the first lines that were rewritten\"\"\"\n    recs = []\n    zoomy_py.parse_blocks(text, filename, recs)\n    lines = text.expandtabs(4).splitlines() if \"\\t\" in text else text.splitlines()\n    raw_lines = text.splitlines()\n    by_first = {r[0]: r for r in recs}\n    out = []\n    stack = []                                   # original indents of the open blocks\n    pending_comments = []\n    i = 1\n\n    def depth_for(indent):\n        while stack and stack[-1] > indent:\n            stack.pop()\n        if not stack or stack[-1] < indent:\n            stack.append(indent)\n        return len(stack) - 1\n\n    def flush_comments(depth):\n        for c in pending_comments:\n            out.append(\"    \" * depth + c)\n        pending_comments.clear()\n\n    while i <= len(raw_lines):\n        raw = raw_lines[i - 1]\n        body = raw.strip()\n        if i in by_first:\n            first, last, written, sentences = by_first[i]\n            ex = raw.expandtabs(4)\n            depth = depth_for(len(ex) - len(ex.lstrip()))\n            flush_comments(depth)\n            # trailing comments of the statement's lines\n            trail = []\n            for k in range(first, last + 1):\n                l = raw_lines[k - 1].rstrip()\n                code = zoomy_py.strip_comment(raw_lines[k - 1]).rstrip()\n                if len(l) > len(code) and code.strip():\n                    trail.append(l[len(code):].strip())\n            joined = \" \".join(written)\n            same = len(sentences) == 1 and sentences[0][1].lower() == joined.lower()\n            if same or first in frozen or any(_internal(t) for _, t in sentences):\n                # already plain (or not for me to touch): keep the author's words and line breaks\n                base = len(raw_lines[first - 1].expandtabs(4)) - len(raw_lines[first - 1].expandtabs(4).lstrip())\n                text_out = []\n                for k in range(first, last + 1):\n                    l = zoomy_py.strip_comment(raw_lines[k - 1]).rstrip().expandtabs(4)\n                    if l.strip():\n                        text_out.append(\"    \" * depth + \" \" * max(0, len(l) - len(l.lstrip()) - base) + l.strip())\n            else:\n                if rewritten is not None:\n                    rewritten.append(first)\n                text_out = [\"    \" * (depth + d) + t for d, t in sentences]\n                # sentences that start with a word of the source keep a source capital ('Let', 'Create', 'Print')\n                if len(sentences) == 1 and written[0].split()[0].lower() == sentences[0][1].split()[0].lower():\n                    w0 = written[0].split()[0]\n                    text_out[0] = \"    \" * (depth + sentences[0][0]) + w0 + sentences[0][1][len(w0):]\n            if trail:\n                text_out[-1] += \"    \" + \" \".join(trail)\n            out += text_out\n            i = last + 1\n            continue\n        if not body:\n            if out and out[-1] != \"\":\n                out.append(\"\")\n            i += 1\n            continue\n        pending_comments.append(body)                                    # a comment line: goes with the next statement\n        i += 1\n    # comments at the end of the file\n    for c in pending_comments:\n        out.append(c)\n    while out and out[-1] == \"\":\n        out.pop()\n    # comments sit right above their statement, but a blank line that came between them stays above the comments\n    return \"\\n\".join(out) + \"\\n\"\n\n\ndef _squash_comment_gaps(text):\n    return text\n\n\ndef format_file(path, verify=True):\n    \"\"\"returns (formatted text, problem or None); the problem says why the original must stay as it is\"\"\"\n    with open(path, encoding=\"utf-8\") as f:\n        text = f.read()\n    try:\n        new = format_text(text, os.path.basename(path))\n    except zoomy_py.ZoomyError as e:\n        return text, f\"cannot read the program: {e}\"\n    if verify:\n        before = _compile(text, path)\n        if _compile(new, path) != before:\n            # some rewrite changes the meaning: find them (halving the set of rewritten statements) and leave those as written\n            changed = []\n            format_text(text, os.path.basename(path), rewritten=changed)\n            good = _safe_rewrites(text, path, before, changed)\n            new = format_text(text, os.path.basename(path), frozen=set(changed) - set(good))\n            if _compile(new, path) != before:\n                return text, \"the formatted program would not compile to the same code (not written; this is a bug in 'fmt', please report the file)\"\n    return new, None\n\n\ndef _safe_rewrites(text, path, before, candidates):\n    \"\"\"the subset of CANDIDATES (first-line numbers) whose rewriting keeps the compiled code\"\"\"\n    def ok(subset):\n        frozen = set(candidates) - set(subset)\n        return _compile(format_text(text, os.path.basename(path), frozen=frozen), path) == before\n    if not candidates or ok(candidates):\n        return list(candidates)\n    if len(candidates) == 1:\n        return []\n    mid = len(candidates) // 2\n    left, right = _safe_rewrites(text, path, before, candidates[:mid]), _safe_rewrites(text, path, before, candidates[mid:])\n    both = left + right\n    return both if ok(both) else left\n", "zoomy_suggest.py": "\"\"\"Whole-sentence suggestions: when a line cannot be read, try small repairs of that one line\n(a misspelt keyword, a missing little word, a stray word, a missing colon) and offer one only if the\nprogram then gets past that line.  The compiler itself is the judge, so a suggestion is never a guess\nthat does not read.\"\"\"\nimport difflib\nimport os\nimport re\nimport time\n\nimport zoomy_py\n\nWORDS = [\"set\", \"add\", \"subtract\", \"multiply\", \"divide\", \"print\", \"write\", \"append\", \"insert\", \"remove\", \"sort\", \"reverse\",\n         \"clear\", \"read\", \"delete\", \"store\", \"show\", \"display\", \"say\", \"return\", \"continue\", \"increase\", \"decrease\", \"double\",\n         \"halve\", \"give\", \"stop\", \"skip\", \"finish\", \"define\", \"repeat\", \"while\", \"until\", \"for\", \"each\", \"from\", \"otherwise\",\n         \"else\", \"unless\", \"if\", \"then\", \"times\", \"with\", \"back\", \"called\", \"named\", \"slots\", \"into\", \"than\", \"equal\", \"greater\",\n         \"less\", \"global\", \"include\", \"make\", \"create\", \"let\", \"check\", \"ask\", \"wait\", \"call\", \"to\", \"by\", \"in\"]\nLITTLE = [\"to\", \"by\", \"from\", \"in\", \"with\", \"as\", \"times\", \"then\", \"and\", \"the\", \"is\", \"of\", \"called\", \"named\", \"back\"]\nHEADS = (\"if\", \"while\", \"for\", \"repeat\", \"define\", \"otherwise\", \"else\", \"unless\", \"until\", \"when\", \"whenever\", \"try\", \"always\", \"routine\", \"action\")\nMAX_TRIES = 400\nMAX_SECONDS = 3.0          # every try re-reads the whole program, so a big program gets fewer tries, never a long wait\n\n\ndef _gate(lines, idx, new, filename, bad_line):\n    \"\"\"does the program read past this line once line idx is replaced?\"\"\"\n    trial = lines[:idx] + [new] + lines[idx + 1:]\n    try:\n        prog = zoomy_py.Program(filename)\n        prog.load_text(\"\\n\".join(trial) + \"\\n\", filename)\n        zoomy_py.compile_python(prog)\n        return True\n    except zoomy_py.ZoomyError as e:\n        return e.line is not None and e.line != bad_line      # an error elsewhere is a later stage, not this line\n    except Exception:\n        return False\n\n\ndef _edits(body, names):\n    \"\"\"candidate rewrites of one line body (no indentation), cheapest first\"\"\"\n    m = re.match(r\"^(.*?)([.:!?]*)$\", body, re.S)\n    core, tail = m.group(1), m.group(2)\n    words = core.split(\" \")\n    out = []\n\n    def add(ws, t=tail):\n        s = \" \".join(ws) + t\n        if s != body and s not in out:\n            out.append(s)\n\n    first = words[0].lower() if words else \"\"\n    # 1. a misspelt keyword\n    for i, w in enumerate(words):\n        lw = w.lower()\n        if len(lw) < 3 or lw in WORDS or lw in names or not lw.isalpha():\n            continue\n        for c in difflib.get_close_matches(lw, WORDS, n=2, cutoff=0.75):\n            add(words[:i] + [c] + words[i + 1:])\n    # 2. a missing or extra colon on a block header\n    if first in HEADS:\n        add(words, \":\")\n    elif tail == \":\":\n        add(words, \"\")\n    # 3. a missing little word\n    for i in range(1, len(words) + 1):\n        for l in LITTLE:\n            add(words[:i] + [l] + words[i:])\n    # 4. a stray word\n    if len(words) > 1:\n        for i in range(len(words)):\n            add(words[:i] + words[i + 1:])\n    # 5. a typo together with a colon\n    typo = list(out[:3])\n    for t in typo:\n        mm = re.match(r\"^(.*?)([.:!?]*)$\", t, re.S)\n        if mm.group(1).split(\" \")[0].lower() in HEADS and mm.group(2) != \":\":\n            add(mm.group(1).split(\" \"), \":\")\n    return out\n\n\ndef suggest(text, filename, err):\n    \"\"\"a whole replacement line for the line the error points at, or None\"\"\"\n    line = getattr(err, \"line\", None)\n    if not line:\n        return None\n    lines = text.splitlines()\n    if not 1 <= line <= len(lines):\n        return None\n    raw = lines[line - 1]\n    body = raw.strip()\n    if not body or body.startswith((\"#\", \"//\")):\n        return None\n    indent = raw[:len(raw) - len(raw.lstrip())]\n    names = {w.lower() for i, l in enumerate(lines) if i != line - 1 for w in re.findall(r\"[A-Za-z_]+\", l)}   # words used elsewhere may be names\n    tries = 0\n    t_end = time.time() + MAX_SECONDS\n    for cand in _edits(body, names):\n        tries += 1\n        if tries > MAX_TRIES or time.time() > t_end:\n            break\n        if _gate(lines, line - 1, indent + cand, filename, line):\n            return cand\n    return None\n\n\ndef hint(path_or_text, err, is_text=False):\n    \"\"\"the 'Did you mean' line to print under an error message, or ''\"\"\"\n    try:\n        if is_text:\n            text, filename = path_or_text, \"<text>\"\n        else:\n            if not os.path.isfile(path_or_text):\n                return \"\"\n            with open(path_or_text, encoding=\"utf-8\") as f:\n                text = f.read()\n            filename = path_or_text\n        if getattr(err, \"file\", None) and os.path.abspath(err.file) != os.path.abspath(filename):\n            return \"\"                                    # the error is in an included file\n        if \"Did you mean\" in str(err):\n            return \"\"\n        s = suggest(text, filename, err)\n        return f\"        Did you mean this sentence: {s}\" if s else \"\"\n    except Exception:\n        return \"\"\n", "zoomy_bignum.zmy": "(Zoomy 7 - the Big Numbers library, written in Zoomy.)\n(A Big Number is 1024 bits of two's complement, kept as 32 limbs of 32 bits, lowest limb first, one limb per slot of the array bn.)\n(Every function takes the slot number where a value starts, so values never need to be copied around.)\n(The compiler lowers Big Numbers programs onto these functions for the machine-code and WebAssembly backends. It runs in unsigned 64-bit mode.)\n(Slots 0..319 belong to the library: 0 = result of a function call, 32/64/96/128/160/192 = scratch values, 224 = shift scratch, 256..299 = decimal chunks.)\n\nCreate an array named bn with 4096 slots\n\n(---- basic moves ----)\ndefine bn_zero with pd:\n    Let a number be called i\n    Let a number be called j\n    for i from 0 to 31:\n        set j to pd + i\n        set item j of bn to 0\n\ndefine bn_copy with pd and ps:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called k\n    Let a number be called x\n    for i from 0 to 31:\n        set j to ps + i\n        set k to pd + i\n        set x to item j of bn\n        set item k of bn to x\n\ndefine bn_small with pd and v:\n    Let a number be called lo\n    Let a number be called hi\n    Let a number be called j\n    set lo to v\n    bitwise and lo with 4294967295\n    set hi to v\n    shift hi right by 32 bits\n    call bn_zero with pd\n    set item pd of bn to lo\n    set j to pd + 1\n    set item j of bn to hi\n\ndefine bn_isneg with pa:\n    Let a number be called j\n    Let a number be called x\n    set j to pa + 31\n    set x to item j of bn\n    shift x right by 31 bits\n    give back x\n\ndefine bn_iszero with pa:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    for i from 0 to 31:\n        set j to pa + i\n        set x to item j of bn\n        if x is above 0:\n            give back 0\n    give back 1\n\n(the low 64 bits as an ordinary number)\ndefine bn_low with pa:\n    Let a number be called lo\n    Let a number be called hi\n    Let a number be called j\n    set lo to item pa of bn\n    set j to pa + 1\n    set hi to item j of bn\n    shift hi left by 32 bits\n    bitwise or lo with hi\n    give back lo\n\n(a slot index or a count: the value when it is 0 .. 2^62-1, else 2^62 (which no array has))\ndefine bn_idx with pa:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called hi\n    Let a number be called lo\n    set j to pa + 31\n    set x to item j of bn\n    shift x right by 31 bits\n    if x is above 0:\n        give back 4611686018427387904\n    for i from 2 to 31:\n        set j to pa + i\n        set x to item j of bn\n        if x is above 0:\n            give back 4611686018427387904\n    set j to pa + 1\n    set hi to item j of bn\n    if hi is above 1073741823:\n        give back 4611686018427387904\n    set lo to item pa of bn\n    shift hi left by 32 bits\n    bitwise or lo with hi\n    give back lo\n\n(---- add, subtract, negate ----)\ndefine bn_add with pd and pa and pb:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called carry\n    Let a number be called t\n    Let a number be called x\n    Let a number be called y\n    set carry to 0\n    for i from 0 to 31:\n        set j to pa + i\n        set x to item j of bn\n        set j to pb + i\n        set y to item j of bn\n        set t to x + y\n        add carry to t\n        set carry to t\n        shift carry right by 32 bits\n        bitwise and t with 4294967295\n        set j to pd + i\n        set item j of bn to t\n\ndefine bn_sub with pd and pa and pb:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called borrow\n    Let a number be called t\n    Let a number be called x\n    Let a number be called y\n    set borrow to 0\n    for i from 0 to 31:\n        set j to pa + i\n        set x to item j of bn\n        set j to pb + i\n        set y to item j of bn\n        set t to x + 4294967296\n        subtract y from t\n        subtract borrow from t\n        set borrow to t\n        shift borrow right by 32 bits\n        set borrow to 1 - borrow\n        bitwise and t with 4294967295\n        set j to pd + i\n        set item j of bn to t\n\ndefine bn_neg with pd and pa:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called carry\n    Let a number be called t\n    Let a number be called x\n    set carry to 1\n    for i from 0 to 31:\n        set j to pa + i\n        set x to item j of bn\n        set t to 4294967295 - x\n        add carry to t\n        set carry to t\n        shift carry right by 32 bits\n        bitwise and t with 4294967295\n        set j to pd + i\n        set item j of bn to t\n\n(---- comparing: 0 = less, 1 = equal, 2 = greater ----)\ndefine bn_ucmp with pa and pb:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called y\n    for i from 0 to 31:\n        set j to pa + 31\n        subtract i from j\n        set x to item j of bn\n        set j to pb + 31\n        subtract i from j\n        set y to item j of bn\n        if x is above y:\n            give back 2\n        if y is above x:\n            give back 0\n    give back 1\n\ndefine bn_cmp with pa and pb:\n    Let a number be called na\n    Let a number be called nb\n    set na to bn_isneg(pa)\n    set nb to bn_isneg(pb)\n    if na is above nb:\n        give back 0\n    if nb is above na:\n        give back 2\n    give back bn_ucmp(pa, pb)\n\n(---- bit by bit operations ----)\ndefine bn_and with pd and pa and pb:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called y\n    for i from 0 to 31:\n        set j to pa + i\n        set x to item j of bn\n        set j to pb + i\n        set y to item j of bn\n        bitwise and x with y\n        set j to pd + i\n        set item j of bn to x\n\ndefine bn_or with pd and pa and pb:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called y\n    for i from 0 to 31:\n        set j to pa + i\n        set x to item j of bn\n        set j to pb + i\n        set y to item j of bn\n        bitwise or x with y\n        set j to pd + i\n        set item j of bn to x\n\ndefine bn_xor with pd and pa and pb:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called y\n    for i from 0 to 31:\n        set j to pa + i\n        set x to item j of bn\n        set j to pb + i\n        set y to item j of bn\n        bitwise xor x with y\n        set j to pd + i\n        set item j of bn to x\n\ndefine bn_andnot with pd and pa and pb:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called y\n    for i from 0 to 31:\n        set j to pa + i\n        set x to item j of bn\n        set j to pb + i\n        set y to item j of bn\n        set y to 4294967295 - y\n        bitwise and x with y\n        set j to pd + i\n        set item j of bn to x\n\ndefine bn_not with pd and pa:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    for i from 0 to 31:\n        set j to pa + i\n        set x to item j of bn\n        set x to 4294967295 - x\n        set j to pd + i\n        set item j of bn to x\n\n(shifts: n is 0 .. 1023; the compiler checks that before it calls these)\ndefine bn_shl with pd and pa and n:\n    Let a number be called q\n    Let a number be called r\n    Let a number be called i\n    Let a number be called j\n    Let a number be called k\n    Let a number be called x\n    Let a number be called lo\n    Let a number be called hi\n    Let a number be called y\n    set q to n / 32\n    set r to n mod 32\n    call bn_zero with 224\n    for i from 0 to 31:\n        set k to i + q\n        if k is below 32:\n            set j to pa + i\n            set x to item j of bn\n            set lo to x\n            shift lo left by r bits\n            bitwise and lo with 4294967295\n            set hi to x\n            set y to 32 - r\n            shift hi right by y bits\n            set j to 224 + k\n            set y to item j of bn\n            bitwise or y with lo\n            set item j of bn to y\n            set k to k + 1\n            if k is below 32:\n                set j to 224 + k\n                set y to item j of bn\n                bitwise or y with hi\n                set item j of bn to y\n    call bn_copy with pd and 224\n\ndefine bn_shr with pd and pa and n:\n    Let a number be called q\n    Let a number be called r\n    Let a number be called i\n    Let a number be called j\n    Let a number be called k\n    Let a number be called x\n    Let a number be called lo\n    Let a number be called hi\n    Let a number be called y\n    set q to n / 32\n    set r to n mod 32\n    call bn_zero with 224\n    for i from q to 31:\n        set k to i - q\n        set j to pa + i\n        set x to item j of bn\n        set lo to x\n        shift lo right by r bits\n        set j to 224 + k\n        set y to item j of bn\n        bitwise or y with lo\n        set item j of bn to y\n        if k is above 0:\n            set hi to x\n            set y to 32 - r\n            shift hi left by y bits\n            bitwise and hi with 4294967295\n            set k to k - 1\n            set j to 224 + k\n            set y to item j of bn\n            bitwise or y with hi\n            set item j of bn to y\n    call bn_copy with pd and 224\n\ndefine bn_sar with pd and pa and n:\n    Let a number be called na\n    set na to bn_isneg(pa)\n    call bn_shr with pd and pa and n\n    if na is 1:\n        call bn_zero with 160\n        call bn_not with 160 and 160\n        call bn_shr with 160 and 160 and n\n        call bn_not with 160 and 160\n        call bn_or with pd and pd and 160\n\ndefine bn_rol with pd and pa and n:\n    Let a number be called m\n    if n is 0:\n        call bn_copy with pd and pa\n        give back 0\n    set m to 1024 - n\n    call bn_shl with 192 and pa and n\n    call bn_shr with 160 and pa and m\n    call bn_or with pd and 192 and 160\n\ndefine bn_ror with pd and pa and n:\n    Let a number be called m\n    set m to 1024 - n\n    if n is 0:\n        set m to 0\n    call bn_rol with pd and pa and m\n\n(single bits)\ndefine bn_getbit with pa and n:\n    Let a number be called j\n    Let a number be called x\n    Let a number be called s\n    set j to n / 32\n    add pa to j\n    set x to item j of bn\n    set s to n mod 32\n    shift x right by s bits\n    bitwise and x with 1\n    give back x\n\ndefine bn_setbit with pd and pa and n:\n    Let a number be called j\n    Let a number be called x\n    Let a number be called v\n    Let a number be called s\n    call bn_copy with pd and pa\n    set j to n / 32\n    add pd to j\n    set x to item j of bn\n    set s to n mod 32\n    set v to 1\n    shift v left by s bits\n    bitwise or x with v\n    set item j of bn to x\n\ndefine bn_clearbit with pd and pa and n:\n    Let a number be called j\n    Let a number be called x\n    Let a number be called v\n    Let a number be called s\n    call bn_copy with pd and pa\n    set j to n / 32\n    add pd to j\n    set x to item j of bn\n    set s to n mod 32\n    set v to 1\n    shift v left by s bits\n    set v to 4294967295 - v\n    bitwise and x with v\n    set item j of bn to x\n\ndefine bn_flipbit with pd and pa and n:\n    Let a number be called j\n    Let a number be called x\n    Let a number be called v\n    Let a number be called s\n    call bn_copy with pd and pa\n    set j to n / 32\n    add pd to j\n    set x to item j of bn\n    set s to n mod 32\n    set v to 1\n    shift v left by s bits\n    bitwise xor x with v\n    set item j of bn to x\n\n(counting)\ndefine bn_popcnt with pa:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called total\n    set total to 0\n    for i from 0 to 31:\n        set j to pa + i\n        set x to item j of bn\n        count the set bits of x\n        add x to total\n    give back total\n\ndefine bn_tzcnt with pa:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    for i from 0 to 31:\n        set j to pa + i\n        set x to item j of bn\n        if x is above 0:\n            count the trailing zeros of x\n            set j to i * 32\n            add x to j\n            give back j\n    give back 1024\n\n(the highest set bit: its number 0 .. 1023, or 1024 for zero)\ndefine bn_hibit with pa:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called q\n    for i from 0 to 31:\n        set q to 31 - i\n        set j to pa + q\n        set x to item j of bn\n        if x is above 0:\n            count the leading zeros of x\n            set j to 63 - x\n            set x to q * 32\n            add j to x\n            give back x\n    give back 1024\n\ndefine bn_lzcnt with pa:\n    Let a number be called h\n    set h to bn_hibit(pa)\n    if h is 1024:\n        give back 1024\n    set h to 1023 - h\n    give back h\n\ndefine bn_bswap with pd and pa:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    for i from 0 to 31:\n        set j to pa + 31\n        subtract i from j\n        set x to item j of bn\n        reverse the bytes of x\n        shift x right by 32 bits\n        set j to 160 + i\n        set item j of bn to x\n    call bn_copy with pd and 160\n\ndefine bn_lowbit with pd and pa:\n    call bn_neg with 128 and pa\n    call bn_and with pd and pa and 128\n\ndefine bn_clearlow with pd and pa:\n    call bn_small with 128 and 1\n    call bn_sub with 128 and pa and 128\n    call bn_and with pd and pa and 128\n\ndefine bn_pext with pd and pa and pb:\n    Let a number be called i\n    Let a number be called k\n    Let a number be called m\n    Let a number be called v\n    call bn_zero with 128\n    set k to 0\n    for i from 0 to 1023:\n        set m to bn_getbit(pb, i)\n        if m is 1:\n            set v to bn_getbit(pa, i)\n            if v is 1:\n                call bn_setbit with 128 and 128 and k\n            add 1 to k\n    call bn_copy with pd and 128\n\ndefine bn_pdep with pd and pa and pb:\n    Let a number be called i\n    Let a number be called k\n    Let a number be called m\n    Let a number be called v\n    call bn_zero with 128\n    set k to 0\n    for i from 0 to 1023:\n        set m to bn_getbit(pb, i)\n        if m is 1:\n            set v to bn_getbit(pa, k)\n            if v is 1:\n                call bn_setbit with 128 and 128 and i\n            add 1 to k\n    call bn_copy with pd and 128\n\n(---- multiply (the low 1024 bits, which is right for signed values too) ----)\ndefine bn_mul with pd and pa and pb:\n    Let a number be called i\n    Let a number be called q\n    Let a number be called lim\n    Let a number be called j\n    Let a number be called k\n    Let a number be called xi\n    Let a number be called y\n    Let a number be called t\n    Let a number be called r\n    Let a number be called carry\n    call bn_zero with 32\n    for i from 0 to 31:\n        set j to pa + i\n        set xi to item j of bn\n        if xi is above 0:\n            set carry to 0\n            set lim to 31 - i\n            for q from 0 to lim:\n                set j to pb + q\n                set y to item j of bn\n                set t to xi * y\n                set k to 32 + i\n                add q to k\n                set r to item k of bn\n                add r to t\n                add carry to t\n                set carry to t\n                shift carry right by 32 bits\n                bitwise and t with 4294967295\n                set item k of bn to t\n    call bn_copy with pd and 32\n\n(---- divide ----)\n(short division in place by a number below 2^32; gives back the remainder)\ndefine bn_divsmall with pa and m:\n    Let a number be called i\n    Let a number be called q\n    Let a number be called j\n    Let a number be called x\n    Let a number be called r\n    Let a number be called cur\n    Let a number be called dq\n    set r to 0\n    for i from 0 to 31:\n        set q to 31 - i\n        set j to pa + q\n        set x to item j of bn\n        set cur to r * 4294967296\n        add x to cur\n        set dq to cur / m\n        set r to cur mod m\n        set item j of bn to dq\n    give back r\n\ndefine bn_shl1 with pd and bit:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called carry\n    set carry to bit\n    for i from 0 to 31:\n        set j to pd + i\n        set x to item j of bn\n        multiply x by 2\n        add carry to x\n        set carry to x\n        shift carry right by 32 bits\n        bitwise and x with 4294967295\n        set item j of bn to x\n\n(unsigned divide of the values at pa and pb (not changed): quotient to slot 64, remainder to slot 96)\ndefine bn_udivmod with pa and pb:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called m\n    Let a number be called r\n    Let a number be called hb\n    Let a number be called pos\n    Let a number be called c\n    Let a number be called bit\n    Let a number be called k\n    Let a number be called v\n    Let a number be called s\n    Let a number be called wide\n    call bn_zero with 64\n    call bn_zero with 96\n    set wide to 0\n    for i from 1 to 31:\n        set j to pb + i\n        set x to item j of bn\n        if x is above 0:\n            set wide to 1\n    if wide is 0:\n        call bn_copy with 64 and pa\n        set m to item pb of bn\n        set r to bn_divsmall(64, m)\n        set item 96 of bn to r\n        give back 0\n    set hb to bn_hibit(pa)\n    if hb is 1024:\n        give back 0\n    for i from 0 to hb:\n        set pos to hb - i\n        set bit to bn_getbit(pa, pos)\n        call bn_shl1 with 96 and bit\n        set c to bn_ucmp(96, pb)\n        if c is above 0:\n            call bn_sub with 96 and 96 and pb\n            set k to pos / 32\n            add 64 to k\n            set x to item k of bn\n            set s to pos mod 32\n            set v to 1\n            shift v left by s bits\n            bitwise or x with v\n            set item k of bn to x\n    give back 0\n\n(the signed versions: slot 128 and 160 hold the magnitudes)\ndefine bn_prep with pa and pb:\n    Let a number be called na\n    Let a number be called nb\n    if bn_iszero(pb) is 1:\n        fail with \"division by zero\"\n    set na to bn_isneg(pa)\n    set nb to bn_isneg(pb)\n    call bn_copy with 128 and pa\n    if na is 1:\n        call bn_neg with 128 and 128\n    call bn_copy with 160 and pb\n    if nb is 1:\n        call bn_neg with 160 and 160\n    call bn_udivmod with 128 and 160\n\ndefine bn_div with pd and pa and pb:\n    Let a number be called na\n    Let a number be called nb\n    Let a number be called s\n    call bn_prep with pa and pb\n    set na to bn_isneg(pa)\n    set nb to bn_isneg(pb)\n    call bn_copy with pd and 64\n    set s to na + nb\n    if s is 1:\n        call bn_neg with pd and pd\n\ndefine bn_rem with pd and pa and pb:\n    Let a number be called na\n    call bn_prep with pa and pb\n    set na to bn_isneg(pa)\n    call bn_copy with pd and 96\n    if na is 1:\n        call bn_neg with pd and pd\n\ndefine bn_mod with pd and pa and pb:\n    Let a number be called na\n    Let a number be called nb\n    Let a number be called nr\n    call bn_prep with pa and pb\n    set na to bn_isneg(pa)\n    set nb to bn_isneg(pb)\n    call bn_copy with 192 and 96\n    if na is 1:\n        call bn_neg with 192 and 192\n    if bn_iszero(192) is 0:\n        set nr to bn_isneg(192)\n        set nr to nr + nb\n        if nr is 1:\n            call bn_add with 192 and 192 and pb\n    call bn_copy with pd and 192\n\n(---- powers and roots ----)\ndefine bn_pow with pd and pa and pb:\n    Let a number be called c\n    Let a number be called nb\n    Let a number be called odd\n    set nb to bn_isneg(pb)\n    if nb is 1:\n        call bn_small with 128 and 1\n        set c to bn_cmp(pa, 128)\n        if c is 1:\n            call bn_small with pd and 1\n            give back 0\n        call bn_neg with 128 and 128\n        set c to bn_cmp(pa, 128)\n        if c is 1:\n            set odd to item pb of bn\n            bitwise and odd with 1\n            call bn_small with pd and 1\n            if odd is 1:\n                call bn_neg with pd and pd\n            give back 0\n        if bn_iszero(pa) is 1:\n            fail with \"division by zero\"\n        call bn_zero with pd\n        give back 0\n    call bn_small with 128 and 1\n    call bn_copy with 160 and pa\n    call bn_copy with 192 and pb\n    repeat forever:\n        if bn_iszero(192) is 1:\n            stop\n        set odd to item 192 of bn\n        bitwise and odd with 1\n        if odd is 1:\n            call bn_mul with 128 and 128 and 160\n        call bn_shr with 192 and 192 and 1\n        if bn_iszero(192) is 1:\n            stop\n        call bn_mul with 160 and 160 and 160\n    call bn_copy with pd and 128\n\ndefine bn_sqrt with pd and pa:\n    Let a number be called hb\n    Let a number be called c\n    Let a number be called t\n    call bn_zero with 160\n    if bn_isneg(pa) is 1:\n        call bn_copy with pd and 160\n        give back 0\n    if bn_iszero(pa) is 1:\n        call bn_copy with pd and 160\n        give back 0\n    call bn_copy with 128 and pa\n    set hb to bn_hibit(pa)\n    set t to hb mod 2\n    set hb to hb - t\n    call bn_zero with 192\n    call bn_setbit with 192 and 192 and hb\n    repeat forever:\n        if bn_iszero(192) is 1:\n            stop\n        call bn_add with 96 and 160 and 192\n        set c to bn_ucmp(128, 96)\n        if c is above 0:\n            call bn_sub with 128 and 128 and 96\n            call bn_shr with 160 and 160 and 1\n            call bn_add with 160 and 160 and 192\n        else:\n            call bn_shr with 160 and 160 and 1\n        call bn_shr with 192 and 192 and 2\n    call bn_copy with pd and 160\n\n(---- text: print and read ----)\n(prints the signed decimal value at pa; no newline)\ndefine bn_print with pa:\n    Let a number be called n\n    Let a number be called chunks\n    Let a number be called k\n    Let a number be called r\n    Let a number be called j\n    Let a number be called p\n    Let a number be called d\n    Let a number be called s\n    call bn_copy with 32 and pa\n    if bn_isneg(pa) is 1:\n        write \"-\"\n        call bn_neg with 32 and 32\n    set chunks to 0\n    repeat forever:\n        set r to bn_divsmall(32, 1000000000)\n        set j to 256 + chunks\n        set item j of bn to r\n        add 1 to chunks\n        if bn_iszero(32) is 1:\n            stop\n    set k to chunks - 1\n    set j to 256 + k\n    set r to item j of bn\n    write r\n    while k is above 0:\n        subtract 1 from k\n        set j to 256 + k\n        set r to item j of bn\n        set p to 100000000\n        repeat 9 times:\n            set d to r / p\n            set s to d + 48\n            write char s\n            set r to r mod p\n            set p to p / 10\n\n(reads a decimal number the way `read x` does; gives back 1 when it worked, 0 when it did not)\ndefine bn_unread with c:\n    set c to c\n\ndefine bn_read with pd:\n    Let a number be called c\n    Let a number be called w\n    Let a number be called neg\n    Let a number be called digits\n    Let a number be called v\n    call bn_zero with pd\n    set neg to 0\n    set digits to 0\n    repeat forever:\n        read the next byte into c\n        if input_ok is 0:\n            give back 0\n        set w to 0\n        if c is 32:\n            set w to 1\n        if c is above 8:\n            if c is below 14:\n                set w to 1\n        if w is 0:\n            stop\n    if c is 45:\n        set neg to 1\n        read the next byte into c\n        if input_ok is 0:\n            set c to 4294967295\n    else if c is 43:\n        read the next byte into c\n        if input_ok is 0:\n            set c to 4294967295\n    repeat forever:\n        if c is above 57:\n            stop\n        if c is below 48:\n            stop\n        set v to c - 48\n        call bn_mulsmall with pd and 10\n        call bn_addsmall with pd and v\n        add 1 to digits\n        read the next byte into c\n        if input_ok is 0:\n            if neg is 1:\n                call bn_neg with pd and pd\n            give back 1\n    if digits is 0:\n        give back 0\n    call bn_unread with c\n    if neg is 1:\n        call bn_neg with pd and pd\n    give back 1\n\ndefine bn_mulsmall with pd and m:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called carry\n    set carry to 0\n    for i from 0 to 31:\n        set j to pd + i\n        set x to item j of bn\n        multiply x by m\n        add carry to x\n        set carry to x\n        shift carry right by 32 bits\n        bitwise and x with 4294967295\n        set item j of bn to x\n\ndefine bn_addsmall with pd and v:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called carry\n    set carry to v\n    for i from 0 to 31:\n        set j to pd + i\n        set x to item j of bn\n        add carry to x\n        set carry to x\n        shift carry right by 32 bits\n        bitwise and x with 4294967295\n        set item j of bn to x\n", "zoomy_bigdec.zmy": "(Zoomy 7 - the Big Decimals library, written in Zoomy.)\n(A Big Decimal is  sign * m * 2^e  with m a whole number of exactly 1024 bits (or 0): binary floating point. It takes 34 slots of the array bn:)\n(slots 0..31 = the 32 limbs of m, 32 bits each, lowest first;  slot 32 = the exponent e plus 4294967296;  slot 33 = the sign, 1 for minus.)\n(Every operation is computed exactly and then cut to 1024 bits. This is the same arithmetic as _bd_* in zoomy_runtime.py, step by step.)\n(It runs in unsigned 64-bit mode. Slots 0..1999 belong to the library: 0 = the value a function gives back; 40, 80, 120 = Big Decimal scratch;)\n(160, 280, 400, 520, 640, 760 = wide whole-number scratch of up to 100 limbs; 880..1699 = decimal digits; 1700 = shift scratch; 1820, 1860, 1900, 1940 = more Big Decimal scratch.)\n\nCreate an array named bn with 8192 slots\n\n(============ whole numbers of n limbs ============)\ndefine w_zero with pd and n:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called lim\n    set lim to n - 1\n    for i from 0 to lim:\n        set j to pd + i\n        set item j of bn to 0\n\ndefine w_copy with pd and ps and n:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called k\n    Let a number be called x\n    Let a number be called lim\n    set lim to n - 1\n    for i from 0 to lim:\n        set j to ps + i\n        set k to pd + i\n        set x to item j of bn\n        set item k of bn to x\n\ndefine w_iszero with pa and n:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called lim\n    set lim to n - 1\n    for i from 0 to lim:\n        set j to pa + i\n        set x to item j of bn\n        if x is above 0:\n            give back 0\n    give back 1\n\n(0 = less, 1 = equal, 2 = greater)\ndefine w_cmp with pa and pb and n:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called y\n    Let a number be called lim\n    set lim to n - 1\n    for i from 0 to lim:\n        set j to pa + lim\n        subtract i from j\n        set x to item j of bn\n        set j to pb + lim\n        subtract i from j\n        set y to item j of bn\n        if x is above y:\n            give back 2\n        if y is above x:\n            give back 0\n    give back 1\n\n(gives back the carry)\ndefine w_add with pd and pa and pb and n:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called carry\n    Let a number be called t\n    Let a number be called x\n    Let a number be called y\n    Let a number be called lim\n    set carry to 0\n    set lim to n - 1\n    for i from 0 to lim:\n        set j to pa + i\n        set x to item j of bn\n        set j to pb + i\n        set y to item j of bn\n        set t to x + y\n        add carry to t\n        set carry to t\n        shift carry right by 32 bits\n        bitwise and t with 4294967295\n        set j to pd + i\n        set item j of bn to t\n    give back carry\n\n(gives back the borrow)\ndefine w_sub with pd and pa and pb and n:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called borrow\n    Let a number be called t\n    Let a number be called x\n    Let a number be called y\n    Let a number be called lim\n    set borrow to 0\n    set lim to n - 1\n    for i from 0 to lim:\n        set j to pa + i\n        set x to item j of bn\n        set j to pb + i\n        set y to item j of bn\n        set t to x + 4294967296\n        subtract y from t\n        subtract borrow from t\n        set borrow to t\n        shift borrow right by 32 bits\n        set borrow to 1 - borrow\n        bitwise and t with 4294967295\n        set j to pd + i\n        set item j of bn to t\n    give back borrow\n\n(shift left by k bits, in an n-limb number; what falls off the top is lost)\ndefine w_shl with pd and pa and k and n:\n    Let a number be called q\n    Let a number be called r\n    Let a number be called i\n    Let a number be called j\n    Let a number be called d\n    Let a number be called x\n    Let a number be called lo\n    Let a number be called hi\n    Let a number be called y\n    Let a number be called lim\n    set q to k / 32\n    set r to k mod 32\n    call w_zero with 1700 and n\n    set lim to n - 1\n    for i from 0 to lim:\n        set d to i + q\n        if d is below n:\n            set j to pa + i\n            set x to item j of bn\n            set lo to x\n            shift lo left by r bits\n            bitwise and lo with 4294967295\n            set hi to x\n            set y to 32 - r\n            shift hi right by y bits\n            set j to 1700 + d\n            set y to item j of bn\n            bitwise or y with lo\n            set item j of bn to y\n            set d to d + 1\n            if d is below n:\n                set j to 1700 + d\n                set y to item j of bn\n                bitwise or y with hi\n                set item j of bn to y\n    call w_copy with pd and 1700 and n\n\n(shift right by k bits)\ndefine w_shr with pd and pa and k and n:\n    Let a number be called q\n    Let a number be called r\n    Let a number be called i\n    Let a number be called j\n    Let a number be called d\n    Let a number be called x\n    Let a number be called lo\n    Let a number be called hi\n    Let a number be called y\n    Let a number be called lim\n    set q to k / 32\n    set r to k mod 32\n    call w_zero with 1700 and n\n    set lim to n - 1\n    if q is below n:\n        for i from q to lim:\n            set d to i - q\n            set j to pa + i\n            set x to item j of bn\n            set lo to x\n            shift lo right by r bits\n            set j to 1700 + d\n            set y to item j of bn\n            bitwise or y with lo\n            set item j of bn to y\n            if d is above 0:\n                set hi to x\n                set y to 32 - r\n                shift hi left by y bits\n                bitwise and hi with 4294967295\n                set d to d - 1\n                set j to 1700 + d\n                set y to item j of bn\n                bitwise or y with hi\n                set item j of bn to y\n    call w_copy with pd and 1700 and n\n\n(the number of the highest set bit, or 99999 when the number is 0)\ndefine w_hibit with pa and n:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called q\n    Let a number be called lim\n    set lim to n - 1\n    for i from 0 to lim:\n        set q to lim - i\n        set j to pa + q\n        set x to item j of bn\n        if x is above 0:\n            count the leading zeros of x\n            set j to 63 - x\n            set x to q * 32\n            add j to x\n            give back x\n    give back 99999\n\ndefine w_getbit with pa and k:\n    Let a number be called j\n    Let a number be called x\n    Let a number be called s\n    set j to k / 32\n    add pa to j\n    set x to item j of bn\n    set s to k mod 32\n    shift x right by s bits\n    bitwise and x with 1\n    give back x\n\n(sets bit k)\ndefine w_setbit with pa and k:\n    Let a number be called j\n    Let a number be called x\n    Let a number be called v\n    Let a number be called s\n    set j to k / 32\n    add pa to j\n    set x to item j of bn\n    set s to k mod 32\n    set v to 1\n    shift v left by s bits\n    bitwise or x with v\n    set item j of bn to x\n\n(multiply in place by a number below 2^32 and add a number below 2^32; gives back what carries out of the top)\ndefine w_muladd with pa and m and v and n:\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called carry\n    Let a number be called lim\n    set carry to v\n    set lim to n - 1\n    for i from 0 to lim:\n        set j to pa + i\n        set x to item j of bn\n        multiply x by m\n        add carry to x\n        set carry to x\n        shift carry right by 32 bits\n        bitwise and x with 4294967295\n        set item j of bn to x\n    give back carry\n\n(divide in place by a number below 2^32; gives back the remainder)\ndefine w_divsmall with pa and m and n:\n    Let a number be called i\n    Let a number be called q\n    Let a number be called j\n    Let a number be called x\n    Let a number be called r\n    Let a number be called cur\n    Let a number be called dq\n    Let a number be called lim\n    set r to 0\n    set lim to n - 1\n    for i from 0 to lim:\n        set q to lim - i\n        set j to pa + q\n        set x to item j of bn\n        set cur to r * 4294967296\n        add x to cur\n        set dq to cur / m\n        set r to cur mod m\n        set item j of bn to dq\n    give back r\n\n(pd gets pa * pb, as na + nb limbs; pd must not be pa or pb)\ndefine w_mul with pd and pa and na and pb and nb:\n    Let a number be called i\n    Let a number be called q\n    Let a number be called lim\n    Let a number be called lim2\n    Let a number be called j\n    Let a number be called k\n    Let a number be called xi\n    Let a number be called y\n    Let a number be called t\n    Let a number be called r\n    Let a number be called carry\n    Let a number be called total\n    set total to na + nb\n    call w_zero with pd and total\n    set lim to na - 1\n    set lim2 to nb - 1\n    for i from 0 to lim:\n        set j to pa + i\n        set xi to item j of bn\n        if xi is above 0:\n            set carry to 0\n            for q from 0 to lim2:\n                set j to pb + q\n                set y to item j of bn\n                set t to xi * y\n                set k to pd + i\n                add q to k\n                set r to item k of bn\n                add r to t\n                add carry to t\n                set carry to t\n                shift carry right by 32 bits\n                bitwise and t with 4294967295\n                set item k of bn to t\n            set k to pd + i\n            add nb to k\n            set item k of bn to carry\n\n(============ Big Decimals ============)\ndefine bd_zero with pd:\n    Let a number be called j\n    call w_zero with pd and 32\n    set j to pd + 32\n    set item j of bn to 4294967296\n    set j to pd + 33\n    set item j of bn to 0\n\ndefine bd_copy with pd and ps:\n    call w_copy with pd and ps and 34\n\n(1 when the number is 0: a number that is not 0 always has its top bit set)\ndefine bd_iszero with pa:\n    Let a number be called j\n    Let a number be called x\n    set j to pa + 31\n    set x to item j of bn\n    if x is 0:\n        give back 1\n    give back 0\n\ndefine bd_sign with pa:\n    Let a number be called j\n    set j to pa + 33\n    give back item j of bn\n\ndefine bd_exp with pa:\n    Let a number be called j\n    set j to pa + 32\n    give back item j of bn\n\n(make the Big Decimal  N * 2^(eb - 4294967296) * (-1)^s  from the n-limb whole number at pn (which is used up))\ndefine bd_norm with pd and s and pn and n and eb:\n    Let a number be called h\n    Let a number be called l\n    Let a number be called sh\n    Let a number be called j\n    set h to w_hibit(pn, n)\n    if h is 99999:\n        call bd_zero with pd\n        give back 0\n    set l to h + 1\n    if l is above 1024:\n        set sh to l - 1024\n        call w_shr with pn and pn and sh and n\n        add sh to eb\n    else if l is below 1024:\n        set sh to 1024 - l\n        call w_shl with pn and pn and sh and n\n        subtract sh from eb\n    set sh to 4294967296 + 1024\n    if eb is above sh:\n        fail with \"a Big Decimal got too large (more than about 1e616)\"\n    set sh to eb + 3072\n    if sh is below 4294967296:\n        call bd_zero with pd\n        give back 0\n    call w_copy with pd and pn and 32\n    set j to pd + 32\n    set item j of bn to eb\n    set j to pd + 33\n    set item j of bn to s\n\n(a small whole number, 0 .. 2^64 - 1)\ndefine bd_small with pd and v:\n    Let a number be called lo\n    Let a number be called hi\n    set lo to v\n    bitwise and lo with 4294967295\n    set hi to v\n    shift hi right by 32 bits\n    call w_zero with 160 and 34\n    set item 160 of bn to lo\n    set item 161 of bn to hi\n    call bd_norm with pd and 0 and 160 and 34 and 4294967296\n\ndefine bd_neg with pd and ps:\n    Let a number be called j\n    Let a number be called s\n    call bd_copy with pd and ps\n    if bd_iszero(ps) is 0:\n        set s to bd_sign(ps)\n        set s to 1 - s\n        set j to pd + 33\n        set item j of bn to s\n\ndefine bd_abs with pd and ps:\n    Let a number be called j\n    call bd_copy with pd and ps\n    set j to pd + 33\n    set item j of bn to 0\n\ndefine bd_add with pd and pa and pb:\n    Let a number be called ea\n    Let a number be called eb\n    Let a number be called e0\n    Let a number be called da\n    Let a number be called db\n    Let a number be called sa\n    Let a number be called sb\n    Let a number be called s\n    Let a number be called c\n    Let a number be called x\n    Let a number be called t\n    if bd_iszero(pa) is 1:\n        call bd_copy with pd and pb\n        give back 0\n    if bd_iszero(pb) is 1:\n        call bd_copy with pd and pa\n        give back 0\n    set ea to bd_exp(pa)\n    set eb to bd_exp(pb)\n    set t to eb + 1100\n    if ea is above t:\n        call bd_copy with pd and pa\n        give back 0\n    set t to ea + 1100\n    if eb is above t:\n        call bd_copy with pd and pb\n        give back 0\n    set e0 to ea\n    if eb is below ea:\n        set e0 to eb\n    set da to ea - e0\n    set db to eb - e0\n    set sa to bd_sign(pa)\n    set sb to bd_sign(pb)\n    call w_zero with 160 and 72\n    call w_copy with 160 and pa and 32\n    call w_shl with 160 and 160 and da and 72\n    call w_zero with 280 and 72\n    call w_copy with 280 and pb and 32\n    call w_shl with 280 and 280 and db and 72\n    if sa is sb:\n        set x to w_add(400, 160, 280, 72)\n        set s to sa\n    else:\n        set c to w_cmp(160, 280, 72)\n        if c is 1:\n            call bd_zero with pd\n            give back 0\n        if c is 2:\n            set x to w_sub(400, 160, 280, 72)\n            set s to sa\n        else:\n            set x to w_sub(400, 280, 160, 72)\n            set s to sb\n    call bd_norm with pd and s and 400 and 72 and e0\n\ndefine bd_sub with pd and pa and pb:\n    call bd_neg with 1820 and pb\n    call bd_add with pd and pa and 1820\n\ndefine bd_mul with pd and pa and pb:\n    Let a number be called s\n    Let a number be called e\n    if bd_iszero(pa) is 1:\n        call bd_zero with pd\n        give back 0\n    if bd_iszero(pb) is 1:\n        call bd_zero with pd\n        give back 0\n    set s to bd_sign(pa)\n    set e to bd_sign(pb)\n    add e to s\n    bitwise and s with 1\n    set e to bd_exp(pa)\n    set s to s\n    set e to e + bd_exp(pb)\n    subtract 4294967296 from e\n    call w_mul with 160 and pa and 32 and pb and 32\n    call bd_norm with pd and s and 160 and 64 and e\n\ndefine bd_div with pd and pa and pb:\n    Let a number be called s\n    Let a number be called e\n    Let a number be called step\n    Let a number be called bit\n    Let a number be called c\n    Let a number be called qb\n    Let a number be called x\n    if bd_iszero(pb) is 1:\n        fail with \"division by zero\"\n    if bd_iszero(pa) is 1:\n        call bd_zero with pd\n        give back 0\n    set s to bd_sign(pa)\n    set x to bd_sign(pb)\n    add x to s\n    bitwise and s with 1\n    set e to bd_exp(pa)\n    add 4294967296 to e\n    set x to bd_exp(pb)\n    subtract x from e\n    subtract 1024 from e\n    call w_zero with 160 and 34\n    call w_zero with 280 and 34\n    call w_zero with 400 and 34\n    call w_copy with 400 and pb and 32\n    for step from 0 to 2047:\n        set bit to 0\n        if step is below 1024:\n            set x to 1023 - step\n            set bit to w_getbit(pa, x)\n        set x to w_muladd(160, 2, bit, 34)\n        set c to w_cmp(160, 400, 34)\n        if c is above 0:\n            set x to w_sub(160, 160, 400, 34)\n            set qb to 2047 - step\n            if qb is below 1088:\n                call w_setbit with 280 and qb\n    call bd_norm with pd and s and 280 and 34 and e\n\ndefine bd_cmp with pa and pb:\n    Let a number be called za\n    Let a number be called zb\n    Let a number be called sa\n    Let a number be called sb\n    Let a number be called ea\n    Let a number be called eb\n    Let a number be called c\n    set za to bd_iszero(pa)\n    set zb to bd_iszero(pb)\n    if za is 1:\n        if zb is 1:\n            give back 1\n        set sb to bd_sign(pb)\n        if sb is 0:\n            give back 0\n        give back 2\n    if zb is 1:\n        set sa to bd_sign(pa)\n        if sa is 0:\n            give back 2\n        give back 0\n    set sa to bd_sign(pa)\n    set sb to bd_sign(pb)\n    if sa is above sb:\n        give back 0\n    if sb is above sa:\n        give back 2\n    set ea to bd_exp(pa)\n    set eb to bd_exp(pb)\n    set c to 1\n    if ea is above eb:\n        set c to 2\n    else if eb is above ea:\n        set c to 0\n    else:\n        set c to w_cmp(pa, pb, 32)\n    if sa is 1:\n        set c to 2 - c\n    give back c\n\n(the whole part of |pa| into the 64-limb number at pw; gives back 1 when |pa| has a fraction)\ndefine bd_intpart with pa and pw:\n    Let a number be called e\n    Let a number be called sh\n    Let a number be called q\n    Let a number be called r\n    Let a number be called i\n    Let a number be called j\n    Let a number be called x\n    Let a number be called frac\n    call w_zero with pw and 64\n    if bd_iszero(pa) is 1:\n        give back 0\n    set e to bd_exp(pa)\n    if e is above 4294967295:\n        call w_copy with pw and pa and 32\n        set sh to e - 4294967296\n        call w_shl with pw and pw and sh and 64\n        give back 0\n    set sh to 4294967296 - e\n    if sh is above 1024:\n        give back 1\n    call w_copy with pw and pa and 32\n    set frac to 0\n    set q to sh / 32\n    set r to sh mod 32\n    for i from 0 to q:\n        if i is below 32:\n            set j to pa + i\n            set x to item j of bn\n            if i is below q:\n                if x is above 0:\n                    set frac to 1\n            else:\n                set j to 1\n                shift j left by r bits\n                subtract 1 from j\n                bitwise and x with j\n                if x is above 0:\n                    set frac to 1\n    call w_shr with pw and pw and sh and 64\n    give back frac\n\ndefine bd_floor with pd and pa:\n    Let a number be called s\n    Let a number be called frac\n    Let a number be called x\n    set s to bd_sign(pa)\n    set frac to bd_intpart(pa, 400)\n    if s is 1:\n        if frac is 1:\n            set x to w_muladd(400, 1, 1, 64)\n    call bd_norm with pd and s and 400 and 64 and 4294967296\n\ndefine bd_ceil with pd and pa:\n    Let a number be called s\n    Let a number be called frac\n    Let a number be called x\n    set s to bd_sign(pa)\n    set frac to bd_intpart(pa, 400)\n    if s is 0:\n        if frac is 1:\n            set x to w_muladd(400, 1, 1, 64)\n    call bd_norm with pd and s and 400 and 64 and 4294967296\n\ndefine bd_trunc with pd and pa:\n    Let a number be called s\n    Let a number be called frac\n    set s to bd_sign(pa)\n    set frac to bd_intpart(pa, 400)\n    call bd_norm with pd and s and 400 and 64 and 4294967296\n\n(halves round away from zero)\ndefine bd_round with pd and pa:\n    Let a number be called s\n    Let a number be called frac\n    Let a number be called x\n    Let a number be called sh\n    Let a number be called b\n    set s to bd_sign(pa)\n    set frac to bd_intpart(pa, 400)\n    if bd_iszero(pa) is 0:\n        set sh to bd_exp(pa)\n        if sh is below 4294967296:\n            set sh to 4294967296 - sh\n            if sh is below 1025:\n                set sh to sh - 1\n                set b to w_getbit(pa, sh)\n                if b is 1:\n                    set x to w_muladd(400, 1, 1, 64)\n    call bd_norm with pd and s and 400 and 64 and 4294967296\n\n(a - b * floor(a / b), and a - b * trunc(a / b))\ndefine bd_mod with pd and pa and pb:\n    call bd_div with 40 and pa and pb\n    call bd_floor with 80 and 40\n    call bd_mul with 120 and pb and 80\n    call bd_sub with pd and pa and 120\n\ndefine bd_rem with pd and pa and pb:\n    call bd_div with 40 and pa and pb\n    call bd_trunc with 80 and 40\n    call bd_mul with 120 and pb and 80\n    call bd_sub with pd and pa and 120\n\ndefine bd_sqrt with pd and pa:\n    Let a number be called e\n    Let a number be called hb\n    Let a number be called p\n    Let a number be called c\n    Let a number be called x\n    if bd_iszero(pa) is 1:\n        call bd_zero with pd\n        give back 0\n    if bd_sign(pa) is 1:\n        fail with \"the square root of a negative number\"\n    set e to bd_exp(pa)\n    call w_zero with 160 and 66\n    set x to 160 + 32\n    call w_copy with x and pa and 32\n    set x to e mod 2\n    if x is 1:\n        call w_shl with 160 and 160 and 1 and 66\n        set e to e - 1\n    call w_zero with 280 and 66\n    call w_zero with 400 and 66\n    set hb to w_hibit(160, 66)\n    set x to hb mod 2\n    set p to hb - x\n    call w_setbit with 400 and p\n    repeat forever:\n        if w_iszero(400, 66) is 1:\n            stop\n        set x to w_add(520, 280, 400, 66)\n        set c to w_cmp(160, 520, 66)\n        if c is above 0:\n            set x to w_sub(160, 160, 520, 66)\n            call w_shr with 280 and 280 and 1 and 66\n            set x to w_add(280, 280, 400, 66)\n        else:\n            call w_shr with 280 and 280 and 1 and 66\n        call w_shr with 400 and 400 and 2 and 66\n    set e to e + 4294967296\n    set e to e / 2\n    subtract 512 from e\n    call bd_norm with pd and 0 and 280 and 66 and e\n\ndefine bd_pow with pd and pa and pb:\n    Let a number be called frac\n    Let a number be called nb\n    Let a number be called nz\n    Let a number be called x\n    set nb to bd_sign(pb)\n    set frac to bd_intpart(pb, 760)\n    if frac is 1:\n        fail with \"Big Decimals can only be raised to whole-number powers\"\n    set nz to w_iszero(760, 64)\n    call bd_small with 40 and 1\n    call bd_copy with 80 and pa\n    repeat forever:\n        if w_iszero(760, 64) is 1:\n            stop\n        set x to w_getbit(760, 0)\n        if x is 1:\n            call bd_mul with 40 and 40 and 80\n        call w_shr with 760 and 760 and 1 and 64\n        if w_iszero(760, 64) is 1:\n            stop\n        call bd_mul with 80 and 80 and 80\n    if nb is 1:\n        if nz is 0:\n            call bd_small with 80 and 1\n            call bd_div with pd and 80 and 40\n            give back 0\n    call bd_copy with pd and 40\n\n(an array index or a count: the value cut to a whole number when it is 0 .. 2^62 - 1, else 2^62 (which no array has))\ndefine bd_idx with pa:\n    Let a number be called frac\n    Let a number be called i\n    Let a number be called x\n    Let a number be called hi\n    Let a number be called lo\n    set frac to bd_intpart(pa, 640)\n    if w_iszero(640, 64) is 1:\n        give back 0\n
